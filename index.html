<body>
<div id="app"></div>
<div id="modal"></div>
<script>
"use strict";
'use strict';
/* =====================================================================
   LE PALAIS DES MORTS — fan game FFXIV non officiel, non commercial.
   Tout le pixel art est dessiné en code (aucun asset Square Enix inclus).

   ===== SPRITES REMPLAÇABLES =====
   Méthode 1 (téléphone, recommandée) : « Atelier des sprites » dans le jeu.
     Importe une image de ta galerie, découpe, fond transparent, enregistre.
     Ces sprites sont stockés dans le navigateur (IndexedDB) et ont la priorité.
   Méthode 2 (fichiers) : mets un PNG dans sprites/ et indique son chemin
     dans "src" (ex : src: "sprites/paladin.png"). Laisse null sinon.
   Si un PNG est introuvable, le jeu revient automatiquement au pixel art.
   ===================================================================== */

/* Aléatoire : générateur sfc32, graine tirée de crypto.getRandomValues à chaque exploration */
let RS = [0,0,0,0];
function newSeed(){ const a=new Uint32Array(4); try{ crypto.getRandomValues(a); }catch(e){ for(let i=0;i<4;i++) a[i]=(Math.random()*4294967296)>>>0; } return Array.from(a); }
function rand(){ let a=RS[0]>>>0,b=RS[1]>>>0,c=RS[2]>>>0,d=RS[3]>>>0; let t=(a+b)>>>0; a=b^(b>>>9); b=(c+(c<<3))>>>0; c=((c<<21)|(c>>>11))>>>0; d=(d+1)>>>0; t=(t+d)>>>0; c=(c+t)>>>0; RS[0]=a;RS[1]=b;RS[2]=c;RS[3]=d; return t/4294967296; }
function seedRNG(arr){ RS = arr; for(let i=0;i<12;i++) rand(); }
seedRNG(newSeed());
const rnd = (a, b) => a + rand() * (b - a);
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

const SPR_CACHE = {};
const CUSTOM = {}; // sprites de l'Atelier (IndexedDB) — priorité maximale
function gridToURL(rows, pal){
  const h = rows.length, w = Math.max(...rows.map(r=>r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r,y)=>{ for(let i=0;i<r.length;i++){ const ch=r[i]; if(ch!=='.' && pal[ch]){ x.fillStyle=pal[ch]; x.fillRect(i,y,1,1);} } });
  return c.toDataURL();
}
function builtinURL(key){
  if (JOBS[key]){
    const rows = HEADS[key].concat(BODIES[JOB_BODY[key]]).map(r=>r.padEnd(16,'.').split(''));
    (WEAPONS[key]||[]).forEach(([x,y,c])=>{ if(rows[y]) rows[y][x]=c; });
    return gridToURL(rows.map(r=>r.join('')), Object.assign({}, BASE_PAL, JOB_PAL[key]));
  }
  if (key.startsWith('c_') && COMPANIONS[key.slice(2)]) return compURL(key.slice(2));
  const b = BUILTIN[key];
  if (!b) return gridToURL(GRIDS.orb, BASE_PAL);
  return gridToURL(GRIDS[b.g], Object.assign({}, BASE_PAL, b.pal||{}));
}
function spriteURL(key){
  if (CUSTOM[key]) return CUSTOM[key];
  const cfg = SPRITES[key];
  if (cfg && cfg._ok) return cfg.src;
  if (typeof ASSET!=='undefined' && ASSET[key] && !ASSET_FAIL[key]) return ASSET[key].src;
  return SPR_CACHE[key] || (SPR_CACHE[key] = builtinURL(key));
}
function refreshSprite(k){ document.querySelectorAll(`img[data-spr="${k}"]`).forEach(el=>el.src=spriteURL(k)); }
const ASSET_FAIL = {};
function sprFail(img){ const k=img.dataset.spr; if(!k||ASSET_FAIL[k]) return; ASSET_FAIL[k]=1; img.classList.remove('art'); img.src=spriteURL(k); }
function spr(key, cls='', style=''){
  const u=spriteURL(key), a=(typeof ASSET!=='undefined')&&ASSET[key]&&u===ASSET[key].src;
  return `<img class="spr ${cls} ${a?'art':''}" data-spr="${key}" src="${u}" style="${a?`--w:${ASSET[key].w};--h:${ASSET[key].h};`:''}${style}" onerror="sprFail(this)" alt="">`;
}
function loadCustomSprites(){
  Object.keys(SPRITES).forEach(k=>{
    const cfg = SPRITES[k]; if(!cfg || !cfg.src) return;
    const img = new Image();
    img.onload = ()=>{ cfg._ok = true; refreshSprite(k); };
    img.onerror = ()=>{ console.warn('Sprite introuvable, pixel art intégré utilisé :', cfg.src); };
    img.src = cfg.src;
  });
}

function floorBG(f){
  const tier = f>=50 ? 5 : Math.min(4, Math.floor((f-1)/10));

}

const IC_CACHE = {};
function ic(n, cls=''){
  const k=n+'|'+cls; if (IC_CACHE[k]) return IC_CACHE[k];
  const g=IC_GRID[n]||IC_GRID.star; let r='';
  g.forEach((row,y)=>{ for(let x=0;x<8;x++){ const c=row[x]; if(c&&c!=='.') r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${IC_PAL[c]}"/>`; } });
  return (IC_CACHE[k] = `<svg class="ic ${cls}" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`);
}
function starsIc(n){ return Array.from({length:n},()=>ic('star')).join(''); }
/* Info-bulles : survol (ordinateur) et appui long (mobile) sur [data-tip] */
(function(){
  let tipEl=null, lpT=null, lpFired=false;
  function show(t, x, y){
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tipbox'; document.body.appendChild(tipEl); }
    tipEl.innerHTML=t; tipEl.style.display='block';
    const w=tipEl.offsetWidth, h=tipEl.offsetHeight, W=innerWidth;
    tipEl.style.left=Math.max(4,Math.min(W-w-4,x-w/2))+'px'; tipEl.style.top=Math.max(4,y-h-12)+'px';
  }
  function hide(){ if(tipEl) tipEl.style.display='none'; }
  const tipOf = el => el && el.closest && el.closest('[data-tip]');
  document.addEventListener('mouseover', e=>{ if (e.pointerType==='touch') return; const t=tipOf(e.target); if(t && matchMedia('(hover:hover)').matches){ const b=t.getBoundingClientRect(); show(t.dataset.tip, b.left+b.width/2, b.top); } else if(!t) hide(); });
  document.addEventListener('touchstart', e=>{ const t=tipOf(e.target); clearTimeout(lpT); lpFired=false; if(!t) { hide(); return; }
    lpT=setTimeout(()=>{ lpFired=true; const b=t.getBoundingClientRect(); show(t.dataset.tip, b.left+b.width/2, b.top); }, 420); }, {passive:true});
  document.addEventListener('touchend', ()=>{ clearTimeout(lpT); if(lpFired) setTimeout(hide, 1600); }, {passive:true});
  document.addEventListener('touchmove', ()=>clearTimeout(lpT), {passive:true});
  // un appui long ne déclenche pas l'action
  document.addEventListener('click', e=>{ if(lpFired && tipOf(e.target)){ e.stopPropagation(); e.preventDefault(); lpFired=false; } }, true);
  document.addEventListener('contextmenu', e=>{ if(tipOf(e.target)) e.preventDefault(); });
  window.TIP = { show, hide };
})();

  return ['gobelin','sylphe','sentinelle','spectre','flannoir','squelettemaudit','dragonnet'];

/* Courbe de difficulté : joueur ET monstres progressent avec l'étage (niveau d'aether = étage).
   h0/a0 = force relative des monstres à l'étage 1 (très faciles), atteint 1.0 à l'étage 10,
   puis +hL/+aL par étage au-delà. La difficulté vient surtout des mécaniques. */
const BAL = { lv:0.08, h0:0.55, a0:0.42, ramp:9, hL:0.03, aL:0.035, elite:{hp:1.4, atk:1.1, enrage:9} };
const Lf = lv => 1 + BAL.lv*(lv-1);
function eMul(f){ const r=Math.min(1,(f-1)/BAL.ramp), late=Math.max(0,f-10); return { h:Lf(f)*(BAL.h0+(1-BAL.h0)*r+BAL.hL*late), a:Lf(f)*(BAL.a0+(1-BAL.a0)*r+BAL.aL*late) }; }

/* ===================== IA DES MONSTRES =====================

   windup:1 => tour de préparation (hour) puis grosse attaque (warn) au tour suivant.
   Les préparations peuvent être interrompues par un étourdissement (bolt), sauf
   chez les gardiens/boss où seules celles marquées interruptible le sont. */
const A = (name, power, o={}) => Object.assign({kind:'atk', name, power, type:'phys'}, o);

const hpr = e => e.hp/e.maxhp;
const AI = {
  flan(e){ if (hpr(e)<0.5 && !e.healed){ e.healed=true; return {kind:'heal', name:'Absorption', pct:0.3}; } return A('Coup gélatineux',1); },
  bomb(e){ if (!e.used && (e.t>=2 || hpr(e)<0.5)){ e.used=true; return A('Explosion',4,{windup:1, selfDestruct:true, type:'mag'}); } return A('Charge',1); },
  imp(e){ return e.t%2 ? A('Foudre',1.3,{type:'mag'}) : A('Griffe',0.9); },
  skeleton(e){ return e.t%3===2 ? A('Fendoir des ombres',3.2,{windup:1}) : A('Coup d’os',1); },
  ahriman(e){ return e.t%3===1 ? A('Regard maudit',0.6,{type:'mag', weaken:2}) : A('Morsure',1); },
  mimic(e){ return e.t%3===1 ? A('Dévorer',3.2,{windup:1}) : A('Morsure',1.15); },
  grenade(e){ if (!e.used && (e.t>=3 || hpr(e)<0.4)){ e.used=true; return A('Autodestruction',4.6,{windup:1, selfDestruct:true, type:'mag'}); } return e.t%2 ? A('Flamme',0.7,{type:'mag', dot:[0.35,3]}) : A('Charge',1); },

    const hurt = alive().filter(x=>x.hp<x.maxhp*0.75).sort((a,b)=>hpr(a)-hpr(b))[0];
    if (hurt && e.t%2===0) return {kind:'heal', name:'Brise curative', pct:0.3, target:hurt.uid};
    return A('Éclat',0.7,{type:'mag'});
  },
  sentinel(e){ const c=e.t%5; if (c===0) return {kind:'shield', name:'Barrière', pct:0.4}; if (c===2) return A('Rayon',2.4,{windup:1, type:'mag', shieldAmp:true}); return A('Poing',1); },
  ghost(e){ return e.t%3===0 ? A('Malédiction',0.6,{type:'mag', dot:[0.45,3]}) : A('Toucher glacé',1,{type:'mag'}); },
  dflan(e){ return e.t%3===2 ? A('Ténèbres',3.2,{windup:1, type:'mag'}) : A('Coup gélatineux',1); },

  drake(e){ return e.t%3===2 ? A('Souffle de feu',2.8,{windup:1, type:'mag', dot:[0.35,3]}) : A('Morsure',1); },
  // --- Gardiens ---
  kingflan(e){
    if (hpr(e)<0.5 && !e.healed){ e.healed=true; return {kind:'heal', name:'Absorption royale', pct:0.25, windup:1, interruptible:true}; }
    return e.t%3===2 ? A('Écrasement',3.4,{windup:1}) : A('Coup gélatineux',1);
  },
  knight(e){

    if (c===1) return {kind:'buffAll', name:'Cri du chevalier', pct:0.5, turns:3, windup:1, interruptible:true};

  },
  bigeye(e){
    if (!e.sum1 && hpr(e)<0.6){ e.sum1=true; return {kind:'summon', name:'Appel spectral', key:'spectre', n:2}; }
    const c=e.t%4; if (c===1) return A('Regard maudit',0.8,{type:'mag', weaken:3});

  },
  queenbomb(e){
    if (hpr(e)<0.25 && !e.used){ e.used=true; return A('Grande explosion',4.8,{windup:1, type:'mag', interruptible:true}); }

    return e.t%4===2 ? A('Souffle ardent',1.2,{type:'mag', dot:[0.35,3]}) : A('Charge',1);
  },
  primesentinel(e){
    const c=e.t%4; if (c===0) return {kind:'shield', name:'Barrière primordiale', pct:0.2};

  void(e){
    const p = hpr(e);
    if (!e.sum1 && p<0.75){ e.sum1=true; return {kind:'summon', name:'Ombres jumelles', key:'spectre', n:2}; }

    if (p>0.35){ const c=e.t%5;
      if (c===0) return {kind:'shield', name:'Voile du néant', pct:0.18};
      if (c===2) return A('Ultima naissante',2.8,{windup:1, type:'mag', shieldAmp:true, interruptible:true});
      if (c===4) return A('Ombre dévorante',3.6,{windup:1, type:'mag'});
      return A('Lame du néant',1.1); }
    return e.t%2===0 ? A('Néant absolu',3.8,{windup:1, type:'mag'}) : A('Lame du néant',1.2,{weaken:2});
  },

const GOOD_POMS = ['force','vitalite','perspi','rajeu','acier'];
const pomCount = id => R.taken.filter(x=>x===id).length;
function rollPoms(n, bonus){
  const pool = POMS.filter(p=>!(p.max && pomCount(p.id)>=p.max) && !(p.id==='potions'&&R.potions>=5) && !(p.id==='ether'&&R.ethers>=3));
  const wt = p => p.w*(bonus && GOOD_POMS.includes(p.id) ? 2 : 1);
  const out=[];
  while(out.length<n && pool.length){
    let r=rand()*pool.reduce((s,p)=>s+wt(p),0);
    for(let i=0;i<pool.length;i++){ r-=wt(pool[i]); if(r<=0){ out.push(pool[i]); pool.splice(i,1); break; } }
  }
  return out;
}

const REW = Object.fromEntries(REWARDS.map(x=>[x.id,x]));
const rewCount = id => R.taken.filter(x=>x===id).length;
const rewOK = x => !(x.max && rewCount(x.id)>=x.max) && !(x.req && !x.req());
/* Tirage : n récompenses distinctes, rareté selon la profondeur et le type de combat */
function rollRarity(kind){
  const f=R.floor, b = kind==='boss'?0.2 : (kind==='elite'||kind==='mimic')?0.1 : 0;
  const ep = Math.min(0.3, 0.02 + 0.004*f + b*0.6 + (R.curse&&R.curse.loot?0.08:0));
  const ra = Math.min(0.5, 0.18 + 0.007*f + b);
  if (kind==='shrine') return rand()<0.3+0.004*f ? 'e' : 'r';
  if (kind==='shrineE') return 'e';
  const x=rand(); return x<ep ? 'e' : x<ep+ra ? 'r' : 'c';
}
function drawRewards(n, kind, excl=[]){
  const out=[];
  for (let i=0;i<n;i++){
    let r=rollRarity(kind), pool=[];
    for (const t of [r, r==='e'?'r':r==='r'?'c':'r', 'c']){ pool=REWARDS.filter(x=>x.r===t && rewOK(x) && !out.includes(x) && !excl.includes(x.id)); if(pool.length) break; }
    if (!pool.length) break;
    out.push(pick(pool));
  }
  return out;
}
function takeReward(x){ x.apply(); R.taken.push(x.id); }

function chip(icn, txt, cls=''){ return `<span class="chip ${cls}">${ic(icn)}${txt!=null&&txt!==''?`<b>${txt}</b>`:''}</span>`; }
function skillTag(s){
  const t=[], sf=s.self||{};
  if (s.power) t.push(chip(s.target==='all'?'zone':((s.stat==='mag'||s.type==='mag')?'magic':'sword'), Math.round(s.power*100*(s.hits||1))+'%'));
  if (sf.heal||sf.healPct) t.push(chip('heal', sf.healPct?Math.round(sf.healPct*100)+'%':sf.heal));
  if (sf.regen) t.push(chip('heal','+'));
  if (sf.mitig) t.push(chip('shield', '-'+Math.round(sf.mitig[0]*100)+'%'));
  else if (sf.invuln||sf.shield||sf.holm) t.push(chip('shield',''));
  if (sf.buff||sf.nextCrit) t.push(chip('up',''));
  if (sf.mpGain) t.push(chip('drop','+'));
  if (s.stun) t.push(chip('bolt',''));
  if (s.dot) t.push(chip('poison',''));
  if (s.mp) t.push(chip('drop', s.mp,'mp'));
  if (s.req) t.push(`<span class="chip"><b>${s.req} Sen</b></span>`);
  if (s.cd) t.push(chip('clock', s.cd,'cd'));
  return t.join('');
}

const MAX_FLOOR = 50;
const isBossFloor = f => f%5===0;

function recalcStats(){
  const j=JOBS[R.job], L=Lf(R.level), old=R.maxhp||0;
  R.maxhp=Math.round(j.hp*L*(1+0.05*R.up.hp)*R.mods.hpMul); R.atk=j.atk*L; R.mag=j.mag*L; R.maxmp=j.mp;
  if (old) R.hp=Math.min(R.maxhp, R.hp + Math.max(0,R.maxhp-old));
}
function startRun(){
  const j=JOBS[S.job], up=Object.assign({},S.upgrades);
  const seed=newSeed(); seedRNG(seed.slice());
  const cid = (S.comp && S.comps[S.comp]) ? S.comp : null;
  R = { v:3, seed, rs:RS, job:S.job, loadout:getLoadout(S.job), level:1, floor:1, up, def:j.def, crit:j.crit,
    mods:{dmg:0.04*up.dmg, def:0, crit:0, vamp:0, gil:0.15*up.gil, cdr:0, hpMul:1, mpr:0}, potions:2+up.potion, ethers:(j.mp>=100?1:0),
    gilsEarned:0, kills:0, taken:[], perk:{}, frags:0, curse:null, rew:null, plan:null,
    comp: cid ? {id:cid, rank:S.comps[cid], revived:false} : null };
  recalcStats(); R.hp=R.maxhp; R.mp=R.maxmp;
  R.plan = planFloor(1);
  S.stats.runs++; S.run=R; persist();
  floorIntro();
}
function healR(n){ R.hp = Math.min(R.maxhp, Math.round(R.hp + n)); }
function gainGils(n){ const g=Math.round(n*(1+R.mods.gil+(R.comp&&R.comp.id==='tataru'?0.25*compPot():0))); R.gilsEarned+=g; return g; }
function spendGils(n){ if (R.gilsEarned<n) return false; R.gilsEarned-=n; return true; }
const potionPct = () => 0.4 + pk('potion');
function isBossNode(){ const P=R.plan; return !!(P && P.steps[P.i] && P.steps[P.i][0]==='boss'); }
function topbarRun(title){ return `<div class="win topbar"><b class="grow">${title}</b>${R.frags?`<span class="frag">${ic('gem')}${R.frags}</span>`:''}<span class="gold">${R.gilsEarned} G</span></div>`; }
function floorIntro(){
  const f=R.floor;
  S.stats.best=Math.max(S.stats.best,f); persist();
  const tip=FLOOR_TIPS[f];
  const g=GUARDIAN_OF[f];
  app.innerHTML = `<div style="flex:1"></div><div class="win center col" style="padding:22px 12px;align-items:center">

    <p class="muted">${g?`${isBigBoss(f)?'Boss':'Gardien'} de l’étage : <b>${ENEMIES[g].name}</b>`:f===1?'Ton niveau d’aether repart à 1 : il monte à chaque étage.':'L’air devient plus lourd…'}</p>

/* --- Plan d’un étage : 3 à 5 étapes variées --- */
const EV_W = f => ({ piege: f>=2?14:0, coffre:12, rencontre:13, autel: f>=2?9:0, pomandre:10, repos:7, marchand: f>=3?8:0, maudite: f>=6?6:0 });
function wpick(w, excl){ const ks=Object.keys(w).filter(k=>w[k]>0 && !excl.includes(k)); let t=ks.reduce((s,k)=>s+w[k],0)*rand(); for(const k of ks){ t-=w[k]; if(t<=0) return k; } return ks[ks.length-1]; }
function planFloor(f){
  const boss=isBossFloor(f);
  const L = f<=3 ? 3 : (rand()<0.5?3:4) + (f>=15 && rand()<0.35?1:0);
  const nReg = boss ? L-1 : L;
  const nF = f<=3 ? 1 : nReg>=4 ? 2 : nReg===3 ? (rand()<0.5?2:1) : 1;
  const kinds = Array(nReg).fill('ev');
  shuffle([...Array(nReg).keys()]).slice(0,nF).forEach(i=>kinds[i]='fight');
  const steps=[], used={}; let prev=[];
  for (let i=0;i<nReg;i++){
    if (kinds[i]==='fight'){ const o=['combat']; if (f>=4 && rand()<0.55) o.push('elite'); steps.push(o); prev=[]; continue; }
    const w=EV_W(f); if(i===0) w.repos=0; if(boss && i===nReg-1) w.repos*=3;
    ['repos','marchand','maudite'].forEach(k=>{ if(used[k]) w[k]=0; });
    const a=wpick(w, prev), b=wpick(w, prev.concat([a]));
    const o=[a,b]; o.forEach(t=>used[t]=1); steps.push(o); prev=o;
  }
  if (boss) steps.push(['boss']);
  return {steps, i:0};
}

function nextFloor(){

const FX_COL = { slash:'255,255,255', holy:'255,250,200', fire:'255,120,40', ice:'140,220,255', thunder:'200,160,255', stone:'200,170,120', wind:'140,255,170',
  poison:'150,230,80', dark:'170,80,220', arrow:'255,240,180', chakra:'255,200,80', jump:'120,150,255', heal:'120,255,140', shield:'120,180,255', enemy:'255,60,60' };

/* --- calculs --- */
const mpCost = s => Math.round((s.mp||0)*(1-pk('mpSave')));
const dmgBonus = () => Math.max(0.2, 1 + R.mods.dmg + (C.st.buffT>0?C.st.buff:0) - (C.st.weakT>0?0.25:0));
const skType = s => s.type || (s.stat==='mag'?'mag':'phys');
function enemyMul(e, type){ let r=e.res[type]||0; if (r>0) r*=(1-pk('pierce')); if (e.resDown) r-=e.resDown; return Math.max(0.1, (1 - r) * (e.flyT>0?0.5:1)); }
function playerHit(s, e){
  const stat = s.stat==='mag' ? R.mag : R.atk;
  const crit = C.st.nextCrit ? true : rand() < (R.crit + R.mods.crit);
  const d = stat * s.power * dmgBonus() * perkMul(s, e) * rnd(0.92,1.08) * (crit?1.5+pk('critMul'):1) * enemyMul(e, skType(s));
  return {d:Math.max(1,Math.round(d)), crit};
}
function perkMul(s, e){

  return 1 + (p>0.8?pk('opener'):0) + (p<0.3?pk('execute'):0) + (e.shield>0?pk('vsShield'):0) + (e.support?pk('vsSupport'):0)
    + (e.boss?pk('boss'):0) + (stunned?pk('stunned'):0) + (s&&s.target==='all'?pk('aoe'):0) + (C.turn===0?pk('firstTurn'):0);
}
function damageEnemy(e, d, crit){

  e.hp = Math.max(0, e.hp - d);
  const el=enEl(e); floatAt(el, (crit? (d+absorbed)+' !' : String(d+absorbed)), crit?'crit':''); anim(el,'hit',260); anim(el,'shake',300);
  if (R.mods.vamp>0) healR((d+absorbed)*R.mods.vamp);

  if (pk('gilKill')) gainGils(pk('gilKill'));
  if (pk('hpKill')) healR(R.maxhp*pk('hpKill'));
  if (pk('mpKill')) R.mp=Math.min(R.maxmp, R.mp+pk('mpKill'));
  if (pk('cdrKill')) Object.keys(C.cds).forEach(k=>{ if(C.cds[k]>0) C.cds[k]--; });

function damagePlayer(raw, x){

  if (x && x.big && st.absorb>0){ st.absorb=0; floatAt(pel,'Absorbé !','info'); fxAt(pel,'shield'); return 0; }
  if (x && x.big) raw *= (1-pk('bigRed'));
  if (x && x.type==='mag') raw *= (1-pk('magRed'));
  let d = Math.max(1, Math.round(raw * (1-effDef()) * (1-(st.mitigT>0?st.mitig:0))));
  if (st.shield>0){ const a=Math.min(st.shield,d); st.shield-=a; d-=a; if(a>0) floatAt(pel,`Bouclier −${a}`,'mp'); }
  if (d>0){
    R.hp -= d;
    if (st.holmT>0 && R.hp<1){ R.hp=1; floatAt(pel,'Holmgang !','info'); }
    floatAt(pel, String(d), 'bad');
    anim(pel,'hit',260); const f=document.getElementById('field'); anim(f,'shake',300); anim(f,'redflash',360);
  }
  return d;
}
function applyStun(e, turns){
  const el=enEl(e);
  if (e.boss){
    if (canInterrupt(e)){ e.pending=null; e.intent={kind:'interrupted'}; e.t++; floatAt(el,'Interrompu !','info'); onInterrupt(e); }
    else floatAt(el,'Insensible','info');
    return;
  }
  const wasBig = e.intent && (e.intent.big||e.intent.kind==='charge');
  if (wasBig){ e.t++; onInterrupt(e); }
  e.stunT=turns; e.pending=null; e.intent={kind:'stun'}; floatAt(el, wasBig?'Interrompu !':'Étourdi !','info');
}
function onInterrupt(e){
  const n=pk('onInterrupt'); if(!n) return;
  healR(R.maxhp*0.08*n); const d=Math.round(Math.max(R.atk,R.mag)*0.8*n); e.hp=Math.max(0,e.hp-d); floatAt(enEl(e),String(d),'crit');
  if (e.hp<=0 && !e.dead) killEnemy(e);
}
/* --- tour du joueur --- */
async function playerAction(id){
  if (!C || C.busy) return;
  const pel=plEl(); let s=null;
  if (id==='__potion'){ if(!R.potions) return; }
  else if (id==='__ether'){ if(!R.ethers) return; }
  else { s=combatSkills().find(x=>x.id===id); if(!s) return; const ss=skillState(s); if(!ss.ok){ toast(ss.cd?`Recharge : encore ${ss.cd} tour(s)`:ss.why==='PM'?'Pas assez de PM':'Pas assez de Sen'); return; } }
  C.busy=true; renderSkills();
  if (id==='__potion'){ R.potions--; const h=Math.round(R.maxhp*potionPct()); healR(h); C.msg='Potion !'; fxAt(pel,'heal'); floatAt(pel,'+'+h,'heal'); updateCombat(); await sleep(450); }
  else if (id==='__ether'){ R.ethers--; const m=Math.round(R.maxmp*0.5); R.mp=Math.min(R.maxmp,R.mp+m); C.msg='Éther !'; fxAt(pel,'shield'); floatAt(pel,'+'+m+' PM','mp'); updateCombat(); await sleep(450); }
  else await useSkill(s);
  if (await checkEnd()) return;
  if (C.cp){ await compAct(); if (await checkEnd()) return; }
  await enemyPhase();
  if (await checkEnd()) return;
  startPlayerTurn();
  await checkEnd();
}
async function useSkill(s){
  const st=C.st, pel=plEl();
  if (s.mp) R.mp-=mpCost(s);
  if (s.cd) C.cds[s.id] = Math.max(1, s.cd - R.mods.cdr);
  if (s.req) st.sen -= s.req;
  C.msg = `${esc(S.name)} utilise <b>${s.name}</b> !`;
  updateCombat();
  anim(plEl(), (s.target==='self' || s.stat==='mag') ? 'cast' : 'lunge', 400);
  await sleep(220);
  if (s.power){
    const targets = s.target==='all' ? alive() : [curTarget()];
    const hits = s.hits||1;
    for (let h=0; h<hits; h++){
      for (const e of targets){
        if (e.dead) continue;
        const r = playerHit(s, e);
        fxAt(enEl(e), s.fx); damageEnemy(e, r.d, r.crit);
        if (s.dot && !e.dead && h===0){ const stat=s.stat==='mag'?R.mag:R.atk; e.dots=e.dots.filter(d=>d.src!==s.id); e.dots.push({src:s.id, dmg:Math.max(1,Math.round(stat*s.dot[0]*dmgBonus()*(1+pk('dotUp'))*Math.max(0.5,1-(e.res[skType(s)]||0)*0.5))), t:s.dot[1]}); }
        if (s.stun && !e.dead && h===0) applyStun(e, s.stun);
      }
      if (hits>1){ updateCombat(); await sleep(200); }
    }
    st.nextCrit=0;
  }
  if (s.sen) st.sen = Math.min(3, st.sen + s.sen);
  const x = s.self;
  if (x){
    if (x.heal){ const h=Math.round(R.mag*x.heal*rnd(0.95,1.05)); const b=R.hp; healR(h); fxAt(pel,'heal'); floatAt(pel,'+'+Math.round(R.hp-b),'heal'); }
    if (x.healPct){ const b=R.hp; healR(R.maxhp*x.healPct); fxAt(pel,'heal'); floatAt(pel,'+'+Math.round(R.hp-b),'heal'); }
    if (x.shield){ st.shield = Math.max(st.shield, Math.round(R.maxhp*x.shield)); fxAt(pel,'shield'); floatAt(pel,'Bouclier','mp'); }
    if (x.mitig){ st.mitig=x.mitig[0]; st.mitigT=x.mitig[1]; fxAt(pel,'shield'); floatAt(pel,s.name,'info'); }
    if (x.invuln){ st.invulnT=x.invuln; fxAt(pel,'holy'); floatAt(pel,'Invincible !','info'); }
    if (x.holm){ st.holmT=x.holm; fxAt(pel,'shield'); floatAt(pel,'Holmgang','info'); }
    if (x.regen){ st.regen=x.regen[0]; st.regenT=x.regen[1]; }
    if (x.buff){ st.buff=x.buff[0]; st.buffT=x.buff[1]; fxAt(pel,'fire'); floatAt(pel,'Puissance !','info'); }
    if (x.nextCrit){ st.nextCrit=1; }
    if (x.mpGain){ R.mp=Math.min(R.maxmp, R.mp+x.mpGain); floatAt(pel,'+'+x.mpGain+' PM','mp'); }
    if (x.cleanse){ st.weakT=0; st.pdotT=0; }
  }
  updateCombat();
  await sleep(420);
}
async function enemyPhase(){
  for (const e of alive()){ // dégâts continus
    if (!e.dots.length) continue;
    let tot=0; e.dots.forEach(d=>{ tot+=d.dmg; d.t--; }); e.dots=e.dots.filter(d=>d.t>0);
    e.hp=Math.max(0,e.hp-tot); floatAt(enEl(e), String(tot), 'dot');
    if (e.hp<=0) killEnemy(e);
  }
  updateCombat();
  if (alive().length===0) return;
  await sleep(300);
  for (const e of alive()){
    if (e.dead) continue;
    await enemyAct(e);
    if (e.buffT>0) e.buffT--;
    if (e.weakT>0) e.weakT--;
    updateCombat();
    if (R.hp<=0) break;
    await sleep(380);
  }
  const st=C.st;
  ['mitigT','invulnT','holmT','buffT','weakT'].forEach(k=>{ if(st[k]>0) st[k]--; });
}
async function enemyAct(e){
  const x=e.intent||A('Attaque',1);
  const el=enEl(e), pel=plEl();
  if (x.kind==='stun'){ e.stunT=Math.max(0,e.stunT-1); C.msg=`${e.name} est étourdi.`; return; }
  if (x.kind==='interrupted'){ C.msg=`${e.name} a été interrompu !`; return; }
  e.t++;
  if (e.flyT>0) e.flyT--;
  if (x.kind==='charge'){ e.pending = Object.assign({}, x.then, {big:true}); C.msg=`${e.name} prépare <b>${x.then.name}</b>…`; anim(el,'cast',400); fxAt(el,'enemy'); return; }
  if (x.kind==='heal'){
    const tg = (x.target && C.enemies.find(z=>z.uid===x.target && !z.dead)) || e;
    const h=Math.round(tg.maxhp*x.pct); tg.hp=Math.min(tg.maxhp,tg.hp+h); C.msg=`${e.name} utilise ${x.name}${tg!==e?' sur '+tg.name:''}.`; fxAt(enEl(tg),'heal'); floatAt(enEl(tg),'+'+h,'heal'); return; }
  if (x.kind==='buffAll'){ alive().forEach(z=>{ z.buff=x.pct; z.buffT=x.turns+(z===e?1:0); }); C.msg=`${e.name} utilise <b>${x.name}</b> ! Ennemis +${Math.round(x.pct*100)} % de dégâts.`; fxAt(el,'fire'); return; }
  if (x.kind==='shield'){ e.shield=Math.round(e.maxhp*x.pct); C.msg=`${e.name} utilise ${x.name} !`; fxAt(el,'shield'); floatAt(el,'Bouclier','info'); return; }
  if (x.kind==='fly'){ e.flyT=x.turns; C.msg=`${e.name} s’envole ! (−50 % de dégâts reçus)`; anim(el,'cast',400); return; }
  if (x.kind==='summon'){
    C.msg=`${e.name} utilise <b>${x.name}</b> !`; anim(el,'cast',400);
    C.enemies = C.enemies.filter(z=>!z.dead);
    const n = Math.min(x.n, 3-C.enemies.length);
    for (let i=0;i<n;i++){ const m=makeEnemy(x.key,'normal'); m.gils=1; m.hp=m.maxhp=Math.round(m.maxhp*0.6); m.hp=m.maxhp=Math.round(m.maxhp*0.6); C.enemies.push(m); planIntentFor(m); }
    C.target=Math.max(0, C.enemies.findIndex(z=>!z.boss)); updateCombat(); return;
  }
  C.msg = `${e.name} utilise <b>${x.name}</b> !`;
  anim(el, 'cast', 300); await sleep(160);
  fxAt(pel, 'enemy');
  const dealt = damagePlayer(eAtk(e) * intentPower(e,x) * rnd(0.9,1.1), x);
  if (dealt>0 && pk('thorns') && !e.dead){ const t=Math.max(1,Math.round(dealt*pk('thorns'))); e.hp=Math.max(0,e.hp-t); floatAt(el,String(t),'dot'); if(e.hp<=0){ killEnemy(e); return; } }
  if (x.rage) e.rage++;
  if (x.land) e.flyT=0;
  if (x.drain){ const h=Math.round(e.maxhp*x.drain); e.hp=Math.min(e.maxhp,e.hp+h); floatAt(el,'+'+h,'heal'); }
  if (x.weaken && C.st.invulnT<=0 && !pk('noWeak')){ C.st.weakT = x.weaken+1; floatAt(pel,'Affaibli','info'); }
  if (x.dot && C.st.invulnT<=0 && !pk('noDot')){ C.st.pdot=Math.max(C.st.pdotT>0?C.st.pdot:0, Math.max(1,Math.round(eAtk(e)*x.dot[0]*(1-effDef())))); C.st.pdotT=x.dot[1]; }
  if (x.selfDestruct){ e.hp=0; e.dead=true; if(el) el.classList.add('dead'); C.msg += ' Il se désintègre.'; }
}
function planIntentFor(e){
  if (e.dead) return;
  if (e.stunT>0){ e.intent={kind:'stun'}; return; }
  if (e.pending){ e.intent=e.pending; e.pending=null; return; }
  const a = AI[e.ai](e);
  if (a.windup){ const then=Object.assign({},a); delete then.windup; e.intent={kind:'charge', then}; }
  else e.intent=a;
}
function planIntents(){ alive().forEach(planIntentFor); }
function startPlayerTurn(){
  const st=C.st, pel=plEl();
  C.turn++;
  Object.keys(C.cds).forEach(k=>{ if(C.cds[k]>0) C.cds[k]--; });
  R.mp = Math.min(R.maxmp, R.mp + Math.round((2 + R.maxmp*0.04)*(1+R.mods.mpr)));
  if (st.regenT>0){ const h=Math.round(R.maxhp*st.regen); healR(h); st.regenT--; floatAt(pel,'+'+h,'heal'); }
  if (pk('regen')>0 && R.hp>0) healR(R.maxhp*pk('regen'));
  if (st.pdotT>0){ R.hp-=st.pdot; st.pdotT--; floatAt(pel,String(st.pdot),'bad'); if(R.hp<1 && st.holmT>0) R.hp=1; }
  planIntents();
  C.busy=false;
  updateCombat();
}
async function checkEnd(){
  if (!C) return true;
  if (C.ending) return true;
  if (R.hp<=0 && tryRevive()) { updateCombat(); return false; }
  if (R.hp<=0){
    C.ending=true; R.hp=0; C.busy=true; C.msg='Tu t’effondres…'; updateCombat();
    const pel=plEl(); if(pel && !FAST){ pel.style.transition='all .6s'; pel.style.filter='grayscale(1)'; pel.style.transform='rotate(90deg)'; }
    await sleep(1100); endRun(false); return true;
  }
  if (alive().length===0){
    C.ending=true; C.busy=true; C.msg='Victoire !'; updateCombat();
    await sleep(600); winCombat(); return true;
  }
  return false;
}
function tryRevive(){
  const pel=plEl();

  if (R.comp && COMPANIONS[R.comp.id].kind==='revive' && !R.comp.revived){ R.comp.revived=true; R.hp=Math.round(R.maxhp*0.25*compPot()); C.msg=`${ic('spark')} ${COMPANIONS[R.comp.id].name} te relève (Vercoeur) !`; fxAt(pel,'holy'); floatAt(pel,'Relevé !','heal'); return true; }
  return false;
}
function fragDrop(kind){
  let n = kind==='boss' ? (R.floor===MAX_FLOOR?5:isBigBoss(R.floor)?3:2) : kind==='elite' ? (rand()<0.3?1:0) : kind==='mimic' ? (rand()<0.35?1:0) : (rand()<0.05?1:0);
  if (R.comp && R.comp.id==='zidane' && rand()<0.06*compPot()) n++;
  R.frags=(R.frags||0)+n; return n;
}
function winCombat(){
  const kind=C.kind; C=null;
  healR(R.maxhp*(R.curse&&R.curse.noHeal?0:0.12)); R.mp=Math.min(R.maxmp, R.mp+Math.round(R.maxmp*0.3));
  const fr=fragDrop(kind);
  if (kind==='boss' && R.floor===MAX_FLOOR) return endRun(true);
  const extra = `<div class="win center"><h2>Victoire !</h2><p>Gils de l’exploration : <span class="gold">${R.gilsEarned}</span>${fr?`<br><span class="frag">${ic('gem')} +${fr} Fragment${fr>1?'s':''} de cristal !</span>`:''}</p></div>`;
  if (kind==='boss'){ healR(R.maxhp*(isBigBoss(R.floor)?1:0.5)); R.mp=R.maxmp; return fightRewards('boss', isBigBoss(R.floor)?'Boss vaincu !':'Gardien vaincu !', extra); }
  fightRewards(kind, 'Combat terminé', extra);
}

function trapChance(t){
  let c = 0.55 + ((JOB_TRAP[R.job]||{})[t.type]||0);
  if (R.comp && ['thancred','locke','zidane'].includes(R.comp.id)) c += 0.15;
  if (R.floor<=3) c += 0.15;
  return clamp(c, 0.15, 0.95);
}
function trapLoot(){

  if (r<0.7 && R.potions<5){ R.potions++; return 'Tu récupères une <b>Potion</b> laissée par un aventurier malchanceux.'; }

}
function trapPenalty(t, k){
  const m = (isTank()?0.6:1) * (R.floor<=3?0.5:1) * k;
  const loss = Math.round(R.maxhp*t.hp*m); R.hp=Math.max(1, R.hp-loss);
  if (t.mp) R.mp=Math.max(0, Math.round(R.mp*(1-t.mp*k)));
  if (t.poison) R.nextPoison=1;
  return loss;
}

/* ===================== ATELIER DES SPRITES =====================
   Flux rapide : « Trouver » (ouvre The Spriters Resource) → enregistrer l'image →
   « Importer » : le fond est détecté et rendu transparent, chaque sprite est isolé
   (composantes connexes + fusion des petits écarts), le meilleur sprite « debout »
   est attribué automatiquement. La grille de vignettes sert seulement à changer.
   Stockage : IndexedDB (sprites en PNG data-URL + planches importées). */
const IDB = {
  db:null,
  open(){ return new Promise(res=>{ try{ if(!window.indexedDB) return res(null); const r=indexedDB.open('palais_des_morts_sprites',1);
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('sprites')) d.createObjectStore('sprites'); if(!d.objectStoreNames.contains('misc')) d.createObjectStore('misc'); };
    r.onsuccess=()=>{ IDB.db=r.result; res(r.result); }; r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }); },
  req(store, mode, fn){ return new Promise(res=>{ try{ if(!IDB.db) return res(undefined); const t=IDB.db.transaction(store,mode); const q=fn(t.objectStore(store)); t.oncomplete=()=>res(q?q.result:undefined); t.onerror=()=>res(undefined); t.onabort=()=>res(undefined); }catch(e){ res(undefined); } }); },
  get(s,k){ return IDB.req(s,'readonly',o=>o.get(k)); },
  put(s,k,v){ return IDB.req(s,'readwrite',o=>o.put(v,k)); },
  del(s,k){ return IDB.req(s,'readwrite',o=>o.delete(k)); },
  all(s){ return new Promise(res=>{ const out={}; try{ if(!IDB.db) return res(out); const t=IDB.db.transaction(s,'readonly'); const c=t.objectStore(s).openCursor();
    c.onsuccess=e=>{ const cur=e.target.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } else res(out); }; c.onerror=()=>res(out); }catch(e){ res(out); } }); },
};

/* --- Détection automatique des sprites dans une planche --- */
function imageToCanvas(img){ const c=document.createElement('canvas'); c.width=img.naturalWidth||img.width; c.height=img.naturalHeight||img.height; c.getContext('2d').drawImage(img,0,0); return c; }
function detectSprites(src, gap){
  const W=src.width, H=src.height, N=W*H;
  const data=src.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;
  // 1) Couleur(s) de fond : couleurs les plus fréquentes sur la bordure (ou transparence)
  const qk=(i)=>((data[i]>>3)<<10)|((data[i+1]>>3)<<5)|(data[i+2]>>3);
  const bc=new Map(); let bt=0, btr=0;
  const addB=(x,y)=>{ const i=(y*W+x)*4; bt++; if(data[i+3]<40){ btr++; return; } const k=qk(i); const o=bc.get(k); if(o) o.n++; else bc.set(k,{n:1,r:data[i],g:data[i+1],b:data[i+2]}); };
  for(let x=0;x<W;x++){ addB(x,0); addB(x,H-1); } for(let y=1;y<H-1;y++){ addB(0,y); addB(W-1,y); }
  const bgs=[...bc.values()].filter(c=>c.n>=0.12*bt).sort((a,b)=>b.n-a.n).slice(0,3);
  // couleur dominante de l'image entière (panneaux de fond internes)
  const gc=new Map(); let gt=0; const step=Math.max(1,Math.floor(N/200000));
  for(let p=0;p<N;p+=step){ const i=p*4; if(data[i+3]<40) continue; gt++; const k=qk(i); const o=gc.get(k); if(o) o.n++; else gc.set(k,{n:1,r:data[i],g:data[i+1],b:data[i+2]}); }
  [...gc.values()].filter(c=>c.n>=0.3*gt).forEach(c=>{ if(!bgs.some(b=>Math.abs(b.r-c.r)+Math.abs(b.g-c.g)+Math.abs(b.b-c.b)<30)) bgs.push(c); });
  const transparentBg = btr>=0.3*bt;
  const fg=new Uint8Array(N);
  for(let p=0;p<N;p++){ const i=p*4; if(data[i+3]<40) continue; let bg=false;
    for(const c of bgs){ if(Math.abs(data[i]-c.r)+Math.abs(data[i+1]-c.g)+Math.abs(data[i+2]-c.b)<=30){ bg=true; break; } }
    if(!bg) fg[p]=1; }
  // 2) Dilatation (fusion des petits écarts : arme détachée, effet…)
  let dm=fg;
  if (gap>0){
    const tmp=new Uint8Array(N); dm=new Uint8Array(N);
    for(let y=0;y<H;y++){ let run=0; const o=y*W; // horizontal : distance au dernier pixel
      let last=-1e9; for(let x=0;x<W;x++){ if(fg[o+x]) last=x; if(x-last<=gap) tmp[o+x]=1; }
      last=1e9; for(let x=W-1;x>=0;x--){ if(fg[o+x]) last=x; if(last-x<=gap) tmp[o+x]=1; } }
    for(let x=0;x<W;x++){ let last=-1e9; for(let y=0;y<H;y++){ if(tmp[y*W+x]) last=y; if(y-last<=gap) dm[y*W+x]=1; }
      last=1e9; for(let y=H-1;y>=0;y--){ if(tmp[y*W+x]) last=y; if(last-y<=gap) dm[y*W+x]=1; } }
  }
  // 3) Composantes connexes (8-voisins)
  const lab=new Int32Array(N); const comps=[]; const stack=new Int32Array(N); let nl=0;
  for(let p=0;p<N;p++){
    if(!dm[p]||lab[p]) continue;
    nl++; let sp=0; stack[sp++]=p; lab[p]=nl;
    const c={id:nl,x0:W,y0:H,x1:-1,y1:-1,n:0,cols:new Set()};
    while(sp){ const q=stack[--sp]; const x=q%W, y=(q-x)/W;
      if(fg[q]){ c.n++; if(x<c.x0)c.x0=x; if(x>c.x1)c.x1=x; if(y<c.y0)c.y0=y; if(y>c.y1)c.y1=y; if(c.cols.size<6) c.cols.add(qk(q*4)); }
      for(let dy=-1;dy<=1;dy++){ const yy=y+dy; if(yy<0||yy>=H) continue; for(let dx=-1;dx<=1;dx++){ const xx=x+dx; if(xx<0||xx>=W) continue; const r=yy*W+xx; if(dm[r]&&!lab[r]){ lab[r]=nl; stack[sp++]=r; } } } }
    if(c.n) comps.push(c);
  }
  // 4) Filtrage : bruit, textes/étiquettes, cadres
  const minPix=Math.max(14, Math.round(N*0.00002));
  const keep=comps.filter(c=>{
    const w=c.x1-c.x0+1, h=c.y1-c.y0+1, dens=c.n/(w*h);
    if (c.n<minPix || w<5 || h<5) return false;               // bruit, traits fins
    if (h<=14 && w/h>=2.5) return false;                       // ligne de texte
    if (c.cols.size<=2 && (h<=18 || w/h>=2.2 || dens<0.35)) return false; // étiquettes / bordures unies
    if (dens<0.12 && (w>W*0.45 || h>H*0.45)) return false;     // cadres
    if (w*h>0.6*N && N>4096) return false;                      // panneau géant
    return true;
  });
  // 5) Ordre de lecture (lignes puis colonnes)
  keep.sort((a,b)=>a.y0-b.y0);
  const rows=[]; keep.forEach(c=>{ const cy=(c.y0+c.y1)/2; const r=rows.find(r=>Math.abs(r.cy-cy)<=Math.max(8,r.h*0.5)); if(r) r.items.push(c); else rows.push({cy,h:c.y1-c.y0+1,items:[c]}); });
  const ordered=[]; rows.sort((a,b)=>a.cy-b.cy).forEach(r=>r.items.sort((a,b)=>a.x0-b.x0).forEach(c=>ordered.push(c)));
  // 6) Découpe avec fond transparent
  const sprites=ordered.slice(0,400).map(c=>{
    const w=c.x1-c.x0+1, h=c.y1-c.y0+1; const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const cx=cv.getContext('2d'); const id=cx.createImageData(w,h), o=id.data;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const p=(c.y0+y)*W+(c.x0+x); if(fg[p] && lab[p]===c.id){ const i=p*4, j=(y*w+x)*4; o[j]=data[i]; o[j+1]=data[i+1]; o[j+2]=data[i+2]; o[j+3]=data[i+3]; } }
    cx.putImageData(id,0,0);
    return {x:c.x0,y:c.y0,w,h,canvas:cv,url:cv.toDataURL(),assigned:null};
  });
  return { sprites, bg: transparentBg ? 'transparent' : (bgs[0]?`rgb(${bgs[0].r},${bgs[0].g},${bgs[0].b})`:'?'), bgRGB: bgs[0]?[bgs[0].r,bgs[0].g,bgs[0].b]:null };
}
function bestFrame(sprites){
  if (!sprites.length) return -1;
  const areas=sprites.map(s=>s.w*s.h).sort((a,b)=>a-b), med=areas[areas.length>>1], big=areas[areas.length-1];
  const ref = sprites.length>=3 ? med : big;
  let i=sprites.findIndex(s=>{ const a=s.w*s.h; return a>=ref*0.6 && a<=ref*3 && s.h>=s.w*0.8; });
  if (i<0) i=sprites.findIndex(s=>s.w*s.h>=ref*0.6);
  return i<0?0:i;
}
function finalizeSprite(cv, flip){
  const M=256, sc=Math.min(1, M/Math.max(cv.width,cv.height));
  const o=document.createElement('canvas'); o.width=Math.max(1,Math.round(cv.width*sc)); o.height=Math.max(1,Math.round(cv.height*sc));
  const x=o.getContext('2d'); x.imageSmoothingEnabled=false;
  if (flip){ x.translate(o.width,0); x.scale(-1,1); }
  x.drawImage(cv,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}
async function saveCustom(key, url){ CUSTOM[key]=url; await IDB.put('sprites',key,url); refreshSprite(key); }
async function resetCustom(key){ delete CUSTOM[key]; await IDB.del('sprites',key); refreshSprite(key); }
async function assignSprite(key, sheet, idx){
  const sp=sheet.sprites[idx]; if(!sp) return;
  sheet.sprites.forEach(s=>{ if(s.assigned===key) s.assigned=null; });
  sp.assigned=key; sheet.lastKey=key; sheet.lastIdx=idx;
  await saveCustom(key, finalizeSprite(sp.canvas, AT.flip));
}
function loadImageFile(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image(); img.onload=()=>{ URL.revokeObjectURL(url); res(img); }; img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('image')); }; img.src=url; }); }
async function addSheetFromFile(file, persistIt=true){
  const img=await loadImageFile(file);
  const cv=imageToCanvas(img);
  const det=detectSprites(cv, AT.gap);
  const sheet={ name:(file.name||'image').replace(/\.[a-z0-9]+$/i,''), canvas:cv, w:cv.width, h:cv.height, ...det, file };
  AT.sheets.unshift(sheet); if (AT.sheets.length>8) AT.sheets.length=8;
  if (persistIt) await IDB.put('misc','sheets', AT.sheets.map(s=>({name:s.name, blob:s.file})));
  return sheet;
}
async function loadStoredSheets(){
  if (AT.loadedStored) return; AT.loadedStored=true;
  const st=await IDB.get('misc','sheets'); if(!Array.isArray(st)) return;
  for (const s of st.slice().reverse()){ try{ if(s.blob){ const sh=await addSheetFromFile(s.blob,false); sh.name=s.name; } }catch(e){} }
}
function guessTargets(name){
  const n=(name||'').toLowerCase(); const out=[];
  Object.keys(KEYWORDS).forEach(k=>{ if (KEYWORDS[k].some(w=>n.includes(w))) out.push(k); });
  return out;
}
function pickFiles(multiple, accept){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; if(accept) i.accept=accept; i.multiple=!!multiple; i.style.display='none';
  i.onchange=()=>{ const f=[...(i.files||[])]; i.remove(); res(f); }; document.body.appendChild(i); AT.lastInput=i; i.click(); }); }

function atRenderList(){
  const el=document.getElementById('atList'); if(!el) return;
  const q=AT.q.trim().toLowerCase();
  const keys=spriteKeys().filter(k=>!q || spriteLabel(k).toLowerCase().includes(q) || k.includes(q) || (SEARCH_EN[k]||'').toLowerCase().includes(q) || spriteGroup(k).toLowerCase().includes(q));
  let html='';
  GROUPS.forEach(g=>{
    const ks=keys.filter(k=>spriteGroup(k)===g);
    if (!ks.length) return;
    html+=`<div class="grp">${g}</div>`+ks.map(k=>`<div class="win row" style="padding:6px 8px;gap:8px">
      <button class="btn small" style="width:58px;min-height:58px;padding:2px" data-k="atinfo-${k}" data-info="${k}">${spr(k,'','width:48px')}</button>
      <div class="grow" style="min-width:0"><b style="font-size:14px">${spriteLabel(k)}</b>${CUSTOM[k]?'<div class="badge">'+ic('star')+' Personnalisé</div>':''}</div>
      <a class="btn small" style="padding:4px 8px;font-size:13px;text-decoration:none" data-k="atfind-${k}" href="${srURL(k)}" target="_blank" rel="noopener noreferrer">${ic('search')} Trouver</a>
      <button class="btn small goldb" style="padding:4px 8px;font-size:13px" data-k="atimp-${k}" data-imp="${k}">${ic('import')} Importer</button></div>`).join('');
  });
  el.innerHTML = html || '<p class="muted center">Aucun résultat.</p>';
  el.querySelectorAll('[data-imp]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.imp; const files=await pickFiles(false,'image/*'); await atImportSheets(files, k); });
  el.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>atTargetModal(b.dataset.info));
}
async function atImportSheets(files, target){
  if (!files || !files.length) return;
  showModal(`<h2>Analyse…</h2><p class="muted">Détection du fond et des sprites (${files.length} image${files.length>1?'s':''}).</p>`);
  await new Promise(r=>setTimeout(r,30));
  const added=[];
  for (const f of files){ try{ added.push(await addSheetFromFile(f)); }catch(e){ toast('Image illisible : '+(f.name||'')); } }
  closeModal();
  if (!added.length) return;
  const sh=added[0];
  if (target){
    const i=bestFrame(sh.sprites);
    if (i<0){ toast('Aucun sprite détecté : utilise « Ajuster »'); return SCREENS.atSheet(0,target); }
    await assignSprite(target, sh, i);
    toast(`${spriteLabel(target)} : sprite attribué !`);
  } else toast(`${added.length} planche(s) analysée(s)`);
  SCREENS.atSheet(0, target);
}
function atTargetModal(k){
  showModal(`<div class="row">${spr(k,'idle','width:72px')}<div class="grow"><h2>${spriteLabel(k)}</h2><div class="muted">${spriteGroup(k)}${CUSTOM[k]?' · <span class="gold">Personnalisé</span>':''}</div></div></div>
   <div class="col" style="margin-top:10px">

    <button class="btn goldb" id="tmImp">${ic('import')} Importer une image</button>
    ${AT.sheets.length?`<button class="btn" id="tmPick">Choisir dans les planches chargées</button>`:''}
    ${CUSTOM[k]?`<button class="btn small" style="width:100%" id="tmFlip">Retourner (miroir) le sprite actuel</button><button class="btn small redb" style="width:100%" id="tmReset">Réinitialiser (pixel art d’origine)</button>`:''}
    <button class="btn small" style="width:100%" id="tmC">Fermer</button></div>`);
  document.getElementById('tmImp').onclick=async()=>{ closeModal(); const f=await pickFiles(false,'image/*'); await atImportSheets(f,k); };
  const p=document.getElementById('tmPick'); if(p) p.onclick=()=>{ closeModal(); SCREENS.atSheet(0,k); };
  const fl=document.getElementById('tmFlip'); if(fl) fl.onclick=async()=>{ const img=new Image(); img.onload=async()=>{ await saveCustom(k, finalizeSprite(imageToCanvas(img), true)); closeModal(); toast('Sprite retourné'); atRenderList(); }; img.src=CUSTOM[k]; };
  const rs=document.getElementById('tmReset'); if(rs) rs.onclick=async()=>{ await resetCustom(k); closeModal(); toast('Sprite réinitialisé'); SCREENS.atelier(); };
  document.getElementById('tmC').onclick=closeModal;
}

function adFocus(){ const r=ADJ.rect; const s=Math.max(0.05, Math.min(ADJ.cw/r.w, ADJ.ch/r.h)*0.6); ADJ.view={s, x:ADJ.cw/2-(r.x+r.w/2)*s, y:ADJ.ch/2-(r.y+r.h/2)*s}; }

function adNorm(r, keepSize){
  const g=ADJ.grid||1, sh=ADJ.sh, sn=v=>Math.round(v/g)*g;
  let x1=sn(r.x), y1=sn(r.y), x2=keepSize? x1+r.w : sn(r.x+r.w), y2=keepSize? y1+r.h : sn(r.y+r.h);

}
function adDraw(){
  const cv=ADJ.cv; if(!cv||!cv.isConnected) return; const x=cv.getContext('2d'), v=ADJ.view, r=ADJ.rect, sh=ADJ.sh;

    for(let gy=0;gy<=sh.h;gy+=ADJ.grid){ const p=Math.round(v.y+gy*v.s)+.5; if(p<0||p>ADJ.ch) continue; x.moveTo(Math.max(0,v.x),p); x.lineTo(Math.min(ADJ.cw,v.x+sh.w*v.s),p); } x.stroke(); }

  x.fillStyle='rgba(0,0,0,.55)'; x.fillRect(0,0,ADJ.cw,a.y); x.fillRect(0,b.y,ADJ.cw,ADJ.ch-b.y); x.fillRect(0,a.y,a.x,b.y-a.y); x.fillRect(b.x,a.y,ADJ.cw-b.x,b.y-a.y);

const adPt = e => { const b=ADJ.cv.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; };
function adDown(e){
  e.preventDefault(); try{ ADJ.cv.setPointerCapture(e.pointerId); }catch(_){}
  const p=adPt(e); ADJ.ptrs.set(e.pointerId,p);
  if (ADJ.ptrs.size===2){ const [p1,p2]=[...ADJ.ptrs.values()]; ADJ.drag={mode:'pinch', d0:Math.hypot(p1.x-p2.x,p1.y-p2.y)||1, m0:{x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2}, v0:{...ADJ.view}}; return; }
  if (ADJ.ptrs.size>2) return;
  if (ADJ.pick){ const ix=Math.floor((p.x-ADJ.view.x)/ADJ.view.s), iy=Math.floor((p.y-ADJ.view.y)/ADJ.view.s);
    if (ix>=0&&iy>=0&&ix<ADJ.sh.w&&iy<ADJ.sh.h){ const d=ADJ.sh.canvas.getContext('2d',{willReadFrequently:true}).getImageData(ix,iy,1,1).data; ADJ.key=[d[0],d[1],d[2]]; }
    ADJ.pick=false; document.getElementById('adPick').classList.remove('sel'); adDraw(); adOut(); ADJ.drag=null; return; }
  const r=ADJ.rect, a=adScr(r.x,r.y), b=adScr(r.x+r.w,r.y+r.h), T=24;
  const corners={tl:[a.x,a.y],tr:[b.x,a.y],bl:[a.x,b.y],br:[b.x,b.y]};

  if (mode==='pan' && p.x>a.x && p.x<b.x && p.y>a.y && p.y<b.y) mode='move';
  ADJ.drag={mode, corner, p0:p, r0:{...r}, v0:{...ADJ.view}};
}
function adMove(e){
  if (!ADJ.ptrs.has(e.pointerId) || !ADJ.drag) return; e.preventDefault();
  const p=adPt(e); ADJ.ptrs.set(e.pointerId,p); const D=ADJ.drag;
  if (D.mode==='pinch'){ if(ADJ.ptrs.size<2) return; const [p1,p2]=[...ADJ.ptrs.values()]; const d=Math.hypot(p1.x-p2.x,p1.y-p2.y), m={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};
    const ns=clamp(D.v0.s*d/D.d0,0.05,64), ix=(D.m0.x-D.v0.x)/D.v0.s, iy=(D.m0.y-D.v0.y)/D.v0.s; ADJ.view={s:ns, x:m.x-ix*ns, y:m.y-iy*ns}; adDraw(); return; }
  const dx=p.x-D.p0.x, dy=p.y-D.p0.y;
  if (D.mode==='pan'){ ADJ.view={s:D.v0.s, x:D.v0.x+dx, y:D.v0.y+dy}; adDraw(); return; }
  const ix=dx/ADJ.view.s, iy=dy/ADJ.view.s, r0=D.r0; const r={...r0};
  if (D.mode==='move'){ r.x=r0.x+ix; r.y=r0.y+iy; ADJ.rect=adNorm(r,true); }
  else { const c=D.corner;
    if (c[1]==='l'){ r.x=Math.min(r0.x+ix, r0.x+r0.w-1); r.w=r0.x+r0.w-r.x; } else r.w=Math.max(1,r0.w+ix);
    if (c[0]==='t'){ r.y=Math.min(r0.y+iy, r0.y+r0.h-1); r.h=r0.y+r0.h-r.y; } else r.h=Math.max(1,r0.h+iy);

}
function adUp(e){ ADJ.ptrs.delete(e.pointerId); if (ADJ.ptrs.size===0 || (ADJ.drag&&ADJ.drag.mode==='pinch')) ADJ.drag=null; adOut(); }
let adQ=0; function adOutQ(){ if(adQ) return; adQ=requestAnimationFrame(()=>{ adQ=0; adOut(); }); }
function adBuild(){

/* --- Packs : export / import (fichier .json à partager) --- */
function exportPack(){
  const n=Object.keys(CUSTOM).length; if(!n){ toast('Aucun sprite personnalisé'); return; }
  const json=JSON.stringify({format:'palais-des-morts-sprites', version:1, date:new Date().toISOString(), sprites:CUSTOM});
  const name='pack-sprites-palais.json';
  const blob=new Blob([json],{type:'application/json'});
  let file=null; try{ file=new File([blob],name,{type:'application/json'}); }catch(e){}
  const canShare = file && navigator.canShare && navigator.canShare({files:[file]});
  showModal(`<h2>Exporter mon pack</h2><p class="muted">${n} sprite(s) dans un seul fichier (${Math.round(json.length/1024)} Ko). Envoie-le à tes amis par messagerie ; ils touchent « Importer un pack » dans leur Atelier.</p>
    <div class="col" style="margin-top:8px">${canShare?'<button class="btn goldb" id="pxS">Partager…</button>':''}<button class="btn ${canShare?'':'goldb'}" id="pxD">Télécharger le fichier</button><button class="btn small" style="width:100%" id="pxC">Fermer</button></div>`);
  const s=document.getElementById('pxS'); if(s) s.onclick=async()=>{ try{ await navigator.share({files:[file], title:'Pack de sprites — Palais des Morts'}); }catch(e){} };
  document.getElementById('pxD').onclick=()=>{ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); };
  document.getElementById('pxC').onclick=closeModal;
}
async function importPackText(txt){
  let o; try{ o=JSON.parse(txt); }catch(e){ return -1; }
  if (!o || o.format!=='palais-des-morts-sprites' || typeof o.sprites!=='object') return -1;
  let n=0;
  for (const k of Object.keys(o.sprites)){ const v=o.sprites[k]; if (SPRITES[k] && typeof v==='string' && /^data:image\/(png|webp|gif|jpeg);base64,/.test(v) && v.length<3e6){ await saveCustom(k,v); n++; } }
  return n;
}
async function importPack(){
  const files=await pickFiles(false,null); if(!files.length) return;
  const n=await importPackText(await files[0].text());
  if (n<0) toast('Fichier de pack invalide'); else toast(`${n} sprite(s) importé(s) !`);
  SCREENS.atelier();
}
async function initCustomSprites(){
  await IDB.open();
  const all=await IDB.all('sprites');
  Object.keys(all).forEach(k=>{ if(SPRITES[k] && typeof all[k]==='string'){ CUSTOM[k]=all[k]; refreshSprite(k); } });
}

const COMP_ORDER = Object.keys(COMPANIONS).sort((a,b)=>COMPANIONS[b].star-COMPANIONS[a].star);
Object.keys(COMPANIONS).forEach(k=>{ SPRITES['c_'+k]={src:null}; SEARCH_EN['c_'+k]=COMPANIONS[k].en; KEYWORDS['c_'+k]=[COMPANIONS[k].en.toLowerCase(), COMPANIONS[k].name.toLowerCase(), k]; });
function compURL(k){
  const a=COMPANIONS[k].art;
  let head = (a.head ? HEADS[a.head] : COMP_HEADS[a.h]).map(r=>r.padEnd(16,'.').split(''));
  if (a.ears){ head[0][3]='K'; head[0][4]='K'; head[0][11]='K'; head[0][12]='K'; head[1][3]='K'; head[1][4]='H'; head[1][11]='H'; head[1][12]='K'; }
  const rows = head.concat(BODIES[a.body].map(r=>r.padEnd(16,'.').split('')));
  (a.w && WEAPONS[a.w] || []).forEach(([x,y,c])=>{ if(rows[y]) rows[y][x]=c; });
  return gridToURL(rows.map(r=>r.join('')), Object.assign({}, BASE_PAL, a.head?JOB_PAL[a.head]:{}, a.pal));
}
/* --- en combat --- */
const compPot = () => R && R.comp ? 1 + 0.08*(R.comp.rank-1) : 1;
const compCd = () => Math.max(2, COMP_KINDS[COMPANIONS[R.comp.id].kind] - (R.comp.rank>=5?1:0) - pk('compCd'));
const compAtk = () => 10*Lf(R.level)*(1+0.04*(R.comp.rank-1));
const bigIncoming = () => alive().some(e=>e.intent && e.intent.kind==='atk' && e.intent.big);
function compHit(e, power, type, o={}){
  if (!e || e.dead) return;
  let mul = o.pierceRes ? (e.flyT>0?0.5:1) : enemyMul(e, type||'phys');
  let d = Math.max(1, Math.round(compAtk()*power*rnd(0.92,1.08)*mul));
  const el=enEl(e);
  if (o.pierce && e.shield>0){ e.hp=Math.max(0,e.hp-d); floatAt(el,String(d),'crit'); if(e.hp<=0 && !e.dead) killEnemy(e); }
  else { const v=R.mods.vamp; R.mods.vamp=0; damageEnemy(e, d, false); R.mods.vamp=v; }
  fxAt(el, type==='mag'?'fire':'slash');
}
async function compAct(){
  const cp=C.cp, d=COMPANIONS[R.comp.id], pot=compPot(), st=C.st, cel=document.getElementById('comp'), pel=plEl();
  if (!alive().length) return;
  cp.cd--;
  const tgt=curTarget();
  let used=null;
  if (cp.cd<=0){
    let kind=d.kind;
    if (kind==='random') kind = bigIncoming() ? 'shield' : hpPct()<0.5 ? 'heal' : 'burst';
    const act = {
      interrupt:()=>{ const e=alive().find(x=>canInterrupt(x)); if(!e) return null; applyStun(e,1); compHit(e,0.5); return 'interrompt '+e.name; },
      heal:()=>{ if (hpPct()>=0.5) return null; const b=R.hp; healR(R.maxhp*0.18*pot); if(d.regen){ st.regen=Math.max(st.regen,0.05*pot); st.regenT=Math.max(st.regenT,2); } fxAt(pel,'heal'); floatAt(pel,'+'+Math.round(R.hp-b),'heal'); return 'te soigne'; },
      regen:()=>{ if (hpPct()>=0.75 || st.regenT>0) return null; st.regen=0.06*pot; st.regenT=3; fxAt(pel,'heal'); return 'lance une régénération'; },
      cleanse:()=>{ if (!(st.weakT>0||st.pdotT>0||hpPct()<0.45)) return null; st.weakT=0; st.pdotT=0; const b=R.hp; healR(R.maxhp*0.15*pot); fxAt(pel,'heal'); floatAt(pel,'+'+Math.round(R.hp-b),'heal'); return 'lance Esuna'; },
      shield:()=>{ if (!(bigIncoming()||hpPct()<0.4)) return null; st.shield=Math.max(st.shield, Math.round(R.maxhp*0.18*pot)); fxAt(pel,'shield'); floatAt(pel,'Bouclier','mp'); return 'te protège d’un bouclier'; },
      absorb:()=>{ if (!bigIncoming() || st.absorb>0) return null; st.absorb=1; fxAt(pel,'shield'); floatAt(pel,'Protégé','info'); return 'se prépare à encaisser l’attaque '+ic('warn')+''; },
      mitig:()=>{ if (!bigIncoming()) return null; st.mitig=Math.max(st.mitigT>0?st.mitig:0, Math.min(0.6,0.4*pot)); st.mitigT=Math.max(st.mitigT,1); fxAt(pel,'shield'); return 'te couvre'; },
      revive:()=>{ compHit(tgt,1.0*pot); return 'frappe à la rapière'; },
      burst:()=>{ if (d.dodge && !(bigIncoming()||cp.cd<=-2)) return null; compHit(tgt, (d.dodge?1.6:1.8)*pot, 'phys', d); if (d.dodge && bigIncoming()){ st.invulnT=Math.max(st.invulnT,1); floatAt(pel,'Esquive préparée','info'); } return 'déchaîne sa technique'; },
      aoe:()=>{ if (alive().length<2 && cp.cd>-1) return null; alive().forEach(e=>compHit(e,0.9*pot,'mag')); return 'lance un sort de zone'; },
      breakshield:()=>{ const e=alive().find(x=>x.shield>0) || (d.resDown && cp.cd<=-2 ? tgt : null); if(!e) return null; if(e.shield>0){ e.shield=0; floatAt(enEl(e),'Bouclier brisé !','info'); } if(d.resDown) e.resDown=0.2; compHit(e,0.8); return 'brise la garde de '+e.name; },
      delay:()=>{ const es=alive().filter(x=>x.enrageAt && x.enrageAt-x.t<=10); if(!es.length || cp.uses>=3) return null; es.forEach(x=>{ x.enrageAt+=2; floatAt(enEl(x),'Rage +2','info'); }); compHit(tgt,0.8,'mag'); return 'ralentit le temps'; },
      haste:()=>{ if (!Object.values(C.cds).some(v=>v>1)) return null; Object.keys(C.cds).forEach(k=>{ if(C.cds[k]>0) C.cds[k]--; }); floatAt(pel,'Hâte','info'); return 'te lance Hâte'; },
      mp:()=>{ if (hasMP()){ if (R.mp>=R.maxmp*0.4) return null; const m=Math.round(R.maxmp*0.35*pot); R.mp=Math.min(R.maxmp,R.mp+m); floatAt(pel,'+'+m+' PM','mp'); return 'te rend des PM'; }
        if (hpPct()>=0.5) return null; healR(R.maxhp*0.15*pot); fxAt(pel,'heal'); return 'te soigne'; },
      loot:()=>{ if (cp.uses>=1) return null; compHit(tgt,1.0); const g=gainGils(4+R.floor); floatAt(enEl(tgt)||pel,'+'+g+' G','info'); return 'vole '+g+' Gils'; },
      stagger:()=>{ const e=alive().find(x=>x.intent&&(x.intent.kind==='stun'||x.intent.kind==='interrupted')); if(!e) return null; compHit(e,2.2*pot); return 'frappe '+e.name+' sans défense'; },
    }[kind];
    const r = act ? act() : null;
    if (r){ used=r; cp.cd=compCd(); cp.uses++; }
  }
  if (!used){ compHit(tgt, 0.25); used='attaque'; }
  if (cel) anim(cel,'lunge',350);
  C.cmsg = used==='attaque' ? 'Attaque' : used.charAt(0).toUpperCase()+used.slice(1)+' !'; C.clog=(C.clog||0)+1; R.compActs=(R.compActs||0)+1;
  const bub=document.getElementById('cbub'); if(bub){ bub.textContent=C.cmsg; bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop'); }
  updateCombat();
  await sleep(380);
}
/* --- Invocation --- */
const GACHA = { x1:5, x10:45, pity:40, p5:0.03, p4:0.22 };
const crand = () => { const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]/4294967296; };
function pullOne(guar4){
  S.pity=(S.pity||0)+1;
  const r=crand(); let st = (S.pity>=GACHA.pity || r<GACHA.p5) ? 5 : (r<GACHA.p5+GACHA.p4 || guar4) ? 4 : 3;
  if (st===5) S.pity=0;
  const pool=Object.keys(COMPANIONS).filter(k=>COMPANIONS[k].star===st), id=pool[Math.floor(crand()*pool.length)];
  const had=S.comps[id]||0; let res;
  if (!had){ S.comps[id]=1; res='new'; } else if (had<5){ S.comps[id]=had+1; res='rank'; } else { S.frag+=2; res='refund'; }
  S.stats.pulls=(S.stats.pulls||0)+1;
  return {id, st, res, rank:S.comps[id]};
}
function doPull(n){
  const cost = n===10 ? GACHA.x10 : GACHA.x1;
  if ((S.frag||0)<cost){ toast('Pas assez de fragments'); return null; }
  S.frag-=cost; const out=[];
  for (let i=0;i<n;i++) out.push(pullOne(n===10 && i===9 && !out.some(o=>o.st>=4)));
  if (!S.comp) S.comp = out[0].id;
  persist(); return out;
}
const stars = n => `<span class="stars s${n}">${starsIc(n)}</span>`;

      <p class="muted">Des héros de tout Final Fantasy répondent à l’appel du cristal. Ils t’accompagnent dans le Palais.</p>

    </div>
    ${results?`<div class="win col"><h3>Résultat</h3><div class="grid5">${results.map(o=>`<div class="gcard s${o.st}">${spr('c_'+o.id,'idle')}<div class="gn">${COMPANIONS[o.id].name}</div>${stars(o.st)}<div class="gt">${o.res==='new'?'NOUVEAU !':o.res==='rank'?'Rang '+o.rank:'+2 '+ic('gem')+''}</div></div>`).join('')}</div></div>`:''}

      <button class="btn goldb" data-k="pull10" id="bPull10" ${S.frag>=GACHA.x10?'':'disabled'}>Invoquer ×10<small style="display:block;font-size:12px">${GACHA.x10} ${ic('gem')}</small></button>
