<style>

body{background:radial-gradient(ellipse at top,#1d2870 0%,#05071a 75%)}

 box-shadow:0 0 0 2px #000,inset 0 0 0 2px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.5);padding:10px 12px;text-shadow:2px 2px 0 #000}

.row{display:flex;align-items:center;gap:8px}

 background:linear-gradient(180deg,#5a78f0,#2236a8 55%,#141f70);color:#fff;font:inherit;font-weight:700;font-size:17px;text-shadow:2px 2px 0 #000;
 box-shadow:0 0 0 2px #000,0 3px 0 2px rgba(0,0,0,.45);cursor:pointer;width:100%;text-align:center;line-height:1.15}

.field{position:relative;flex:1;min-height:210px;border:2px solid #f0f2ff;border-radius:7px;box-shadow:0 0 0 2px #000;overflow:hidden;background-color:#151030;background-size:64px 64px}

.cursor{position:absolute;left:-2px;top:46%;width:30px;animation:bob .4s steps(2) infinite alternate;z-index:4}

 background:radial-gradient(rgba(255,140,40,.6),rgba(255,70,20,.3) 60%,rgba(255,60,20,.05) 72%);border:2px solid rgba(255,170,80,.95);animation:aoe .5s infinite alternate}

.float{position:absolute;font-weight:900;font-size:22px;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;animation:floatUp 1s ease-out forwards;pointer-events:none;z-index:20;white-space:nowrap}
.float.crit{color:#ffe14a;font-size:28px}
.float.heal{color:#7dff7a}.float.mp{color:#8ad0ff}.float.info{font-size:15px;color:#f0f0ff}.float.bad{color:#ff6a6a;font-size:24px}.float.dot{color:#c8ff7a;font-size:18px}

.shake{animation:shake .3s}

.lunge{animation:lunge .32s}

.ppanel{padding:8px 10px}

@keyframes toast{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.center{text-align:center}
img.spr{aspect-ratio:1/1;object-fit:contain;object-position:50% 100%}
.intent.int{border-color:#8fff8f;box-shadow:0 0 0 1px #2a8a2a}

input[type=range]{accent-color:#ffe27a;height:30px}

.stars{color:#c8d0e0;font-size:12px;letter-spacing:-1px}.stars.s4{color:#c890ff}.stars.s5{color:var(--gold);text-shadow:0 0 4px #ffb000}

.ic{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.15em;image-rendering:pixelated;flex:none}

.btn[disabled]{opacity:.45;filter:grayscale(.6);pointer-events:none}
.btn.ol-busy{opacity:.7;pointer-events:none}
.btn.ol-busy::after{content:"";width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:olspin .7s linear infinite}
.ol-spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:olspin .7s linear infinite;vertical-align:middle}
@keyframes olspin{to{transform:rotate(360deg)}}
.ol-empty{padding:18px 10px;text-align:center}
.ol-ok{color:#8fff8f;font-size:13px}.ol-ko{color:#ff9c96;font-size:13px}
.ol-lab{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#d6e2ff;font-weight:700}
.ol-lab input.name{font-size:16px;font-weight:600}
.ol-tabs{display:flex;gap:6px;padding:0 2px;flex-wrap:wrap}
.ol-tabs .btn{flex:1;min-height:40px;font-size:14px}
.ol-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:none}
.ol-chips::-webkit-scrollbar{display:none}
.ol-chip{flex:none;display:flex;align-items:center;gap:4px;font:inherit;font-size:12px;font-weight:700;color:#fff;background:#0a1248;border:2px solid #8890b0;border-radius:14px;padding:2px 10px 2px 4px;min-height:32px;text-shadow:1px 1px 0 #000}
.ol-chip:first-child{padding-left:10px}
.ol-chip.sel{border-color:var(--gold);background:#2a3a8a;box-shadow:0 0 6px #ffb00088}
.ol-chip img.spr{width:22px}
.ol-lb{padding:4px 6px}
.ol-run{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid #ffffff22}
.ol-run:last-child{border-bottom:0}
.ol-run.me{background:linear-gradient(90deg,#ffe27a22,transparent);border-radius:6px}
.ol-rk{width:26px;text-align:center;font-weight:800;font-size:16px;color:#c8d2ff;text-shadow:1px 1px 0 #000;flex:none}
.ol-run.top1 .ol-rk{color:var(--gold);font-size:20px}.ol-run.top2 .ol-rk{color:#e8ecff;font-size:18px}.ol-run.top3 .ol-rk{color:#e0a060;font-size:18px}
.ol-sp{position:relative;width:40px;flex:none;display:flex;justify-content:center}
.ol-sp img.spr{width:34px}
.ol-sp2{position:absolute;right:-6px;bottom:-4px}.ol-sp2 img.spr{width:24px}
.ol-who{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.ol-who b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-who small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-duo{color:#9fe0ff;font-weight:700}
.ol-sc{text-align:right;display:flex;flex-direction:column;flex:none}
.ol-sc b{font-size:16px;color:var(--gold);text-shadow:1px 1px 0 #000}.ol-sc small{font-size:11px;color:#c8d2ff}
.ol-search{flex:none;gap:6px}
.ol-fr{display:flex;align-items:center;gap:8px;min-height:44px;padding:2px 0;border-bottom:1px solid #ffffff1a}
.ol-fr:last-child{border-bottom:0}
.ol-fr .grow{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.ol-fr .btn.small{min-height:38px;font-size:13px;padding:3px 10px}
.ol-fr .btn.ol-x{padding:3px 8px;background:linear-gradient(180deg,#4a4a6a,#24243a)}
.ol-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#5a6080;border:2px solid #000;flex:none}
.ol-dot.on{background:#5fd36b;box-shadow:0 0 6px #5fd36b}
.ol-code{font-size:22px!important;letter-spacing:6px;text-align:center;text-transform:uppercase}
.ol-bigcode{font-size:40px;font-weight:900;letter-spacing:8px;color:var(--gold);text-shadow:3px 3px 0 #000;font-family:ui-monospace,Menlo,Consolas,monospace}
.ol-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ol-slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;min-height:150px;justify-content:center;
  background:linear-gradient(180deg,var(--w1),var(--w2) 42%,var(--w3));border:2px solid #f0f2ff;border-radius:7px;box-shadow:0 0 0 2px #000;text-align:center}
.ol-slot.ready{box-shadow:0 0 0 2px #000,0 0 0 4px #5fd36b}
.ol-slot.empty{opacity:.7;border-style:dashed}
.ol-slot img.spr{width:64px}
.ol-slot b{font-size:15px}.ol-slot small{font-size:11px;color:#d6e2ff}
.ol-tag{position:absolute;top:4px;left:4px;font-size:10px;font-weight:800;background:#000a;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 4px}
.ol-rdy{font-size:12px;font-weight:700;color:#c8d2ff;display:flex;align-items:center;gap:3px}
.ol-slot.ready .ol-rdy{color:#8fff8f}
#ol-net{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 4px);transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:8px;
  max-width:min(440px,94vw);width:max-content;padding:4px 10px;font-size:12px;font-weight:700;border:2px solid #f0f2ff;border-radius:14px;box-shadow:0 0 0 2px #000;
  background:linear-gradient(180deg,var(--w1),var(--w3));text-shadow:1px 1px 0 #000;pointer-events:none}
#ol-net.wait{border-color:var(--gold)}
#ol-net.go{border-color:#5fd36b}
#ol-net.warn{border-color:#ff6a62;background:linear-gradient(180deg,#8a2a2a,#3a0a0a)}
#ol-net .ol-code-s{font-family:ui-monospace,Menlo,monospace;color:#c8d2ff;font-size:11px}
/* ===== Vue de côté : alliés à gauche (regardent à droite), ennemis à droite (regardent à gauche) ===== */
#field .player,#field .comp{transform:none}
#field .player{left:22%;bottom:14%;z-index:4}
#field.solo .player{left:12%;bottom:22%}
#field .comp{left:3%;bottom:38%;z-index:3}
#field.duo .comp:not(.partner){left:24%;bottom:60%;z-index:2}
#field .enemies{left:auto;right:1%;top:24%;bottom:10%;width:58%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:flex-end;gap:4px 2px}
#field .en{min-width:64px}
#field .en:nth-child(even){margin-top:34px}
#field .en img.spr.art{width:min(calc(var(--w) * 1.7px),25vw);max-height:min(130px,20vh)}
#field .en.boss img.spr.art{width:min(calc(var(--w) * 2px),52vw);max-height:min(220px,32vh)}
#field .player img.spr.art{width:min(calc(var(--w) * 1.8px),24vw)}
#field .comp img.spr.art{width:min(calc(var(--w) * 1.5px),20vw)}
#field .aoe{left:3%;right:auto;transform:none;width:46%;bottom:6%}
img.spr.flip{transform:scaleX(-1)}
#field .player.lunge,#field .comp.lunge{animation:lungeR .32s}
@keyframes lungeR{50%{transform:translateX(26px) scale(1.06)}}
#field .en.lunge{animation:lungeL .32s}
@keyframes lungeL{50%{transform:translateX(-26px)}}
#field .player.cast,#field .comp.cast{animation:castS .4s}
@keyframes castS{50%{transform:translateY(-8px);filter:brightness(1.6) drop-shadow(0 0 8px #fff)}}
#field .player.shake,#field .comp.shake{animation:shakeS .3s}
@keyframes shakeS{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}}
@media (max-width:360px){#field .enemies{width:62%}#field .en{min-width:56px}}
.pnlink{position:absolute;top:6px;right:8px;font-size:12px;color:#c8d0ff;background:none;border:0;text-decoration:underline;padding:6px;cursor:pointer;z-index:5}
.pn-scroll{max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px;margin-top:6px}
.pn{margin-bottom:12px}
.pn-ban{height:min(80px,16vw);border-radius:6px;background-size:cover;background-position:left center;display:flex;align-items:flex-end;gap:8px;padding:4px 8px;box-shadow:0 0 0 2px #000,0 0 0 3px #f0f2ff}
.pn-ban b{font-size:20px;text-shadow:2px 2px 0 #000}.pn-ban span{font-size:12px;text-shadow:1px 1px 0 #000;margin-bottom:3px}
.pn ul{margin:6px 0 0 18px;padding:0;font-size:13px;line-height:1.35}.pn li{margin:2px 0}
.legal{font-size:9.5px;line-height:1.3;color:#aab0d0;text-align:center;margin:6px 4px 0}
.gcar{position:relative;overflow:hidden;border-radius:8px;box-shadow:0 0 0 2px #000,0 0 0 3px #f0f2ff;touch-action:pan-y}
.gtrack{display:flex;transition:transform .35s ease}
.gban{flex:0 0 100%;position:relative;height:min(230px,52vw);background:radial-gradient(ellipse at 30% 60%,var(--gl) -40%,var(--c1) 30%,var(--c2) 85%);overflow:hidden}
.gban::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,rgba(0,0,0,.55));pointer-events:none}
.gfeat{position:absolute;left:6%;bottom:6%;z-index:2;filter:drop-shadow(0 0 10px var(--gl)) drop-shadow(0 0 2px #fff)}
.gfeat img.spr{width:min(130px,30vw);height:auto;image-rendering:pixelated}
.gside{position:absolute;left:38%;bottom:6%;display:flex;gap:2px;z-index:1;opacity:.92}
.gside img.spr{width:min(62px,14vw);height:auto;image-rendering:pixelated;filter:drop-shadow(0 0 5px var(--gl))}
.ginfo{position:absolute;right:8px;top:8px;width:46%;text-align:right;z-index:3;display:flex;flex-direction:column;gap:2px;text-shadow:1px 1px 0 #000,0 0 6px #000}
.ginfo small{font-size:10px;letter-spacing:1px;color:#e8ecff}.ginfo>b{font-size:17px;color:#fff3c0;line-height:1.1}.ginfo span{font-size:11px;line-height:1.3}
.gcopy{position:absolute;right:6px;bottom:4px;font-size:9px;color:#fffc;z-index:3;text-shadow:1px 1px 0 #000}
.gpart i{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--gl);box-shadow:0 0 6px var(--gl);animation:gup 3s linear infinite;opacity:0}
@keyframes gup{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-240px);opacity:0}}
.garr{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:34px;height:44px;border:2px solid #f0f2ff;border-radius:6px;background:#0008;color:#fff;font-size:24px;line-height:1;padding:0}
.garr.l{left:4px}.garr.r{right:4px}
.gdots{display:flex;justify-content:center;gap:7px;margin:6px 0}
.gdots span{width:9px;height:9px;border-radius:50%;background:#556;border:1px solid #000;cursor:pointer}.gdots span.on{background:#ffe27a}
.gcard.up{box-shadow:0 0 0 2px #ffe27a,0 0 10px #ffe27a}
.rt{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}.rt th,.rt td{border-bottom:1px solid #fff2;padding:3px 4px;text-align:left}.rt td:last-child,.rt th:last-child{text-align:right}
.rt tr.up td{color:#ffe27a}
.rules p{font-size:13px;line-height:1.35;margin:4px 0}.rules h3{margin:8px 0 2px;font-size:15px}
/* v5.1 : sprites officiels Brave Exvius (vue de côté) et tuiles FFXIV */
img.spr.art{image-rendering:pixelated}
img.spr.tile{image-rendering:auto;border-radius:9px;box-shadow:0 0 0 2px #000a}
#field .comp img.spr.tile,#field .player img.spr.tile{width:min(60px,16vw)}
#field .en img.spr.tile{width:min(64px,17vw)}
.gfeat img.spr.tile{width:min(96px,24vw)}.gside img.spr.tile{width:min(48px,12vw)}
#field .player img.spr.art:not(.tile){width:min(calc(var(--w) * 2px),26vw)}
#field .comp img.spr.art:not(.tile){width:min(calc(var(--w) * 1.8px),23vw)}
.gfeat img.spr.art:not(.tile){width:auto;height:min(128px,32vw);max-width:46vw;object-fit:contain}
.gside img.spr.art:not(.tile){width:auto;height:min(64px,16vw);max-width:20vw;object-fit:contain}
/* v5.1 : bannières verticales avec illustration officielle */
.gban{height:min(52vh,560px);min-height:340px}
.gban::after{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 26%,transparent 62%,rgba(0,0,0,.7) 100%)}
.gart{position:absolute;inset:0 -8% 0 18%;background-size:contain;background-repeat:no-repeat;background-position:right bottom;opacity:.92;filter:drop-shadow(0 0 22px var(--gl));animation:gartIn .7s ease-out both}
.gshade{position:absolute;inset:0;background:radial-gradient(ellipse at 22% 85%,var(--gl) -30%,transparent 55%),linear-gradient(90deg,var(--c2) 0%,transparent 55%);opacity:.75;pointer-events:none}
@keyframes gartIn{from{opacity:0;transform:translateX(18px) scale(1.03)}to{opacity:.92;transform:none}}
.gban .ginfo{top:12px;bottom:auto;z-index:4}
.gfeat{left:4%;bottom:5%;z-index:3}
.gfeat img.spr.art:not(.tile){height:min(170px,22vh);max-width:52vw}
.gside{left:4%;bottom:auto;top:auto;bottom:calc(5% + min(176px,23vh));z-index:3;gap:6px}
.gban .gcopy{z-index:4}
.gpart{z-index:2}
/* v5.1 : navigation fluide et thème hors combat */
#app.enter{animation:scrIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button.tap{animation:tapK .22s ease-out}
@keyframes tapK{0%{transform:scale(.96)}100%{transform:scale(1)}}

body.home .title-logo h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:38px;letter-spacing:.14em;line-height:1.1;text-shadow:0 0 24px #7fb0ff,0 2px 0 #000;background:linear-gradient(180deg,#fff,#cfe0ff 60%,#9fbfff);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== v5.3 : direction artistique FFXIV (menus hors combat) ===== */
@font-face{font-family:'Cinzel';src:url(assets/fonts/cinzel-latin.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'Source Sans 3';src:url(assets/fonts/sourcesans3-latin.woff2) format('woff2');font-weight:200 900;font-display:swap}
:root{--xg:#e6cc8f;--xg2:#b8924f;--xs:#c9d2e0;--xpanel:linear-gradient(180deg,rgba(22,20,28,.80),rgba(10,10,16,.86))}
body.modern{font-family:'Source Sans 3',system-ui,sans-serif;font-weight:500}
body.modern h1,body.modern h2,body.modern h3,body.modern .topbar b,body.modern .tm,body.modern .xh,body.modern .path-n,body.modern .ff-title{font-family:'Cinzel',Georgia,serif;font-weight:600;letter-spacing:.06em}
body.modern .topbar{background:linear-gradient(180deg,rgba(8,8,12,.85),rgba(8,8,12,.35));border:0;border-bottom:0;box-shadow:none;position:relative}
body.modern .topbar::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--xg),transparent);opacity:.55}
body.modern .topbar b{color:#f3e6c4;font-size:17px}
.tb-back{background:none;border:0;color:var(--xg);padding:4px 6px 4px 0;margin-right:4px;display:flex;align-items:center;cursor:pointer;min-height:0}
.tb-back:active{filter:drop-shadow(0 0 6px var(--xg))}
body.modern .win:not(.topbar){background:var(--xpanel);border:0;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(230,204,143,.28);backdrop-filter:blur(4px)}
body.modern .xsec{padding:12px 4px 8px;position:relative}
body.modern .xsec+.xsec{margin-top:4px}
body.modern .xh{font-size:15px;color:var(--xg);margin:0 0 8px;padding-bottom:6px;position:relative;display:flex;align-items:center;gap:8px}
body.modern .xh::after{content:"";position:absolute;left:0;right:30%;bottom:0;height:1px;background:linear-gradient(90deg,var(--xg2),transparent)}
body.modern .muted{color:#aab3c4}
/* boutons FFXIV : pastille dégradée, sans cadre */
body.modern .btn{border:0;border-radius:999px;background:linear-gradient(180deg,rgba(70,64,56,.62),rgba(26,24,24,.78));color:#f1ead8;box-shadow:inset 0 1px 0 rgba(255,240,200,.18),0 4px 14px rgba(0,0,0,.35);font-family:'Source Sans 3',sans-serif;font-weight:700;letter-spacing:.02em;text-shadow:0 1px 2px #000}
body.modern .btn:disabled{opacity:.45;filter:grayscale(.6)}
body.modern .btn.goldb{background:linear-gradient(180deg,#f2dca0,#c39a52 55%,#94702f);color:#2a1c06;text-shadow:0 1px 0 rgba(255,240,200,.6);box-shadow:0 0 18px rgba(230,190,110,.35),inset 0 1px 0 #fff6d8}
body.modern .btn.redb{background:linear-gradient(180deg,#a8423a,#5a1814);color:#fff}
body.modern .btn.small{min-height:40px}
/* glyphes officiels (une seule famille dorée) */
.gi{width:30px;height:30px;object-fit:contain;flex:none;filter:drop-shadow(0 0 4px rgba(230,200,140,.35))}

const SPR_CACHE = {};
function gridToURL(rows, pal){
  const h = rows.length, w = Math.max(...rows.map(r=>r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r,y)=>{ for(let i=0;i<r.length;i++){ const ch=r[i]; if(ch!=='.' && pal[ch]){ x.fillStyle=pal[ch]; x.fillRect(i,y,1,1);} } });
  return c.toDataURL();
}
function builtinURL(key){
  if (JOBS[key]){
    const rows = HEADS[key].concat(BODIES[JOB_BODY[key]]).map(r=>r.padEnd(16,'.').split(''));
    (WEAPONS[key]||[]).forEach(([x,y,c])=>{ if(rows[y]) rows[y][x]=c; });
    return gridToURL(rows.map(r=>r.join('')), Object.assign({}, BASE_PAL, JOB_PAL[key]));
  }
  if (key.startsWith('c_') && COMPANIONS[key.slice(2)]) return compURL(key.slice(2));
  const b = BUILTIN[key];
  if (!b) return gridToURL(GRIDS.orb, BASE_PAL);
  return gridToURL(GRIDS[b.g], Object.assign({}, BASE_PAL, b.pal||{}));
}
function spriteURL(key){
  const cfg = SPRITES[key];
  if (cfg && cfg._ok) return cfg.src;
  if (typeof ASSET!=='undefined' && ASSET[key] && !ASSET_FAIL[key]) return ASSET[key].src;
  if (typeof ASSET!=='undefined' && ASSET[key]) return ASSET[key].src; // jamais de dessin de remplacement
  try { return SPR_CACHE[key] || (SPR_CACHE[key] = builtinURL(key)); } catch(e){ return 'data:image/gif;base64,R0lGODlhAQABAAAAACw='; }
}
function refreshSprite(k){ document.querySelectorAll(`img[data-spr="${k}"]`).forEach(el=>el.src=spriteURL(k)); }
const ASSET_FAIL = {};
function sprFail(img){ const k=img.dataset.spr; if(/\.webp$/.test(img.getAttribute('src')||'')){ img.src=img.getAttribute('src').replace(/\.webp$/,'.png'); return; } if(!k||ASSET_FAIL[k]) return; ASSET_FAIL[k]=1; img.style.visibility='hidden'; } /* pas de dessin de remplacement : uniquement des sprites officiels */
function spr(key, cls='', style=''){
  const u=spriteURL(key), a=(typeof ASSET!=='undefined')&&ASSET[key]&&u===ASSET[key].src;
  return `<img class="spr ${cls} ${a?'art':''} ${a&&ASSET[key].tile?'tile':''} ${a&&ASSET[key].glyph?'glyph':''} ${a&&ASSET[key].smooth?'smooth':''}" data-spr="${key}" src="${u}" style="${a?`--w:${ASSET[key].w};--h:${ASSET[key].h};`:''}${style}" onerror="sprFail(this)" decoding="async" alt="">`;
}
function loadCustomSprites(){
  Object.keys(SPRITES).forEach(k=>{
    const cfg = SPRITES[k]; if(!cfg || !cfg.src) return;
    const img = new Image();
    img.onload = ()=>{ cfg._ok = true; refreshSprite(k); };
    img.onerror = ()=>{ console.warn('Sprite introuvable, pixel art intégré utilisé :', cfg.src); };
    img.src = cfg.src;
  });
}

/* Préchargement des images pendant les temps morts : décodage avant affichage */
const PRE = (()=>{ const seen=new Map(), q=[]; let busy=0;
  const idle = f => (window.requestIdleCallback ? requestIdleCallback(f,{timeout:800}) : setTimeout(f,60));
  function pump(){ while(busy<4 && q.length){ const u=q.shift(); if(seen.has(u)) continue; const im=new Image(); im.decoding='async'; seen.set(u,im); busy++;
      im.onload=()=>{ (im.decode?im.decode():Promise.resolve()).catch(()=>{}).then(()=>{ busy--; idle(pump); }); }; im.onerror=()=>{ busy--; idle(pump); }; im.src=u; } }
  function add(urls, first){ urls=urls.filter(u=>u && !seen.has(u)); if(first) q.unshift(...urls); else q.push(...urls); idle(pump); }
  function sprites(keys){ return keys.map(k=>ASSET[k]&&ASSET[k].src).filter(Boolean); }
  function forRun(){ const f=(typeof R!=='undefined'&&R)?R.floor:1; const job=(typeof R!=='undefined'&&R&&R.job)||S.job;
    const comps=Object.keys(S.comps||{}).map(k=>'c_'+k);
    add(bgsNear(f).concat(bandsNear(f)).concat(bgsNear(Math.min(50,f+10))).concat(sprites([job].concat(comps))), true);
    add(sprites(Object.keys(ASSET).filter(k=>/monsters\//.test(ASSET[k].src)))); }
  function forHub(){ add((typeof BANNERS!=='undefined'?BANNERS:[]).map(b=>'assets/art/'+b.f5+'.webp'), true); add(sprites(Object.keys(ASSET))); }
  return { add, forRun, forHub };
})();

const BG_ELITE=['e0','e1','e2','e3','e4'];
const bgTier = f => Math.min(4, Math.floor((Math.max(1,f)-1)/10));
function roomBG(){
  const f=R.floor, kind=C&&C.kind, t=bgTier(f);
  if (kind==='boss' && isBigBoss(f)) return 'assets/bg/b'+Math.min(50,f)+'.webp';
  if (kind==='elite') return 'assets/bg/'+BG_ELITE[t]+'.webp';
  let h=2166136261; const key=(R.seed||[]).join(',')+'|'+f+'|'+((R.plan&&R.plan.i)||0);
  for (const c of key) h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;
  const L=BG_TIER[t]; return 'assets/bg/'+L[h%L.length]+'.webp';
}
const bgsNear = f => { const t=bgTier(f), out=BG_TIER[t].concat([BG_ELITE[t]]).map(k=>'assets/bg/'+k+'.webp'); const nb=Math.ceil(f/10)*10; if(nb<=50) out.push('assets/bg/b'+nb+'.webp'); return out; };
function floorBG(f){
  const tier = f>=50 ? 5 : Math.min(4, Math.floor((f-1)/10));

}

const IC_CACHE = {};
function ic(n, cls=''){
  const k=n+'|'+cls; if (IC_CACHE[k]) return IC_CACHE[k];
  const g=IC_GRID[n]||IC_GRID.star; let r='';
  g.forEach((row,y)=>{ for(let x=0;x<8;x++){ const c=row[x]; if(c&&c!=='.') r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${IC_PAL[c]}"/>`; } });
  return (IC_CACHE[k] = `<svg class="ic ${cls}" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`);
}
function starsIc(n){ return Array.from({length:n},()=>ic('star')).join(''); }
/* Info-bulles : survol (ordinateur) et appui long (mobile) sur [data-tip] */
(function(){
  let tipEl=null, lpT=null, lpFired=false;
  function show(t, x, y){
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tipbox'; document.body.appendChild(tipEl); }
    tipEl.innerHTML=t; tipEl.style.display='block';
    const w=tipEl.offsetWidth, h=tipEl.offsetHeight, W=innerWidth;
    tipEl.style.left=Math.max(4,Math.min(W-w-4,x-w/2))+'px'; tipEl.style.top=Math.max(4,y-h-12)+'px';
  }
  function hide(){ if(tipEl) tipEl.style.display='none'; }
  const tipOf = el => el && el.closest && el.closest('[data-tip]');
  document.addEventListener('mouseover', e=>{ if (e.pointerType==='touch') return; const t=tipOf(e.target); if(t && matchMedia('(hover:hover)').matches){ const b=t.getBoundingClientRect(); show(t.dataset.tip, b.left+b.width/2, b.top); } else if(!t) hide(); });
  document.addEventListener('touchstart', e=>{ const t=tipOf(e.target); clearTimeout(lpT); lpFired=false; if(!t) { hide(); return; }
    lpT=setTimeout(()=>{ lpFired=true; const b=t.getBoundingClientRect(); show(t.dataset.tip, b.left+b.width/2, b.top); }, 420); }, {passive:true});
  document.addEventListener('touchend', ()=>{ clearTimeout(lpT); if(lpFired) setTimeout(hide, 3500); }, {passive:true});
  document.addEventListener('touchmove', ()=>clearTimeout(lpT), {passive:true});
  // un appui long ne déclenche pas l'action
  document.addEventListener('click', e=>{ if(lpFired && tipOf(e.target)){ e.stopPropagation(); e.preventDefault(); lpFired=false; } }, true);
  document.addEventListener('contextmenu', e=>{ if(tipOf(e.target)) e.preventDefault(); });
  window.TIP = { show, hide };
})();

/* Courbe de difficulté : joueur ET monstres progressent avec l'étage (niveau d'aether = étage).
   h0/a0 = force relative des monstres à l'étage 1 (très faciles), atteint 1.0 à l'étage 10,
   puis +hL/+aL par étage au-delà. La difficulté vient surtout des mécaniques. */
const BAL = { lv:0.08, h0:0.55, a0:0.42, ramp:7, hL:0.045, aL:0.08, elite:{hp:1.3, atk:1.1, enrage:9},
  // v5.5 : combats plus courts mais plus percutants (PV ennemis réduits selon l'étage et le type, attaque relevée, plafond par coup)
  kh:{ n0:0.9, nk:0.07, boss:0.85, big:0.95, fin:0.35, late:0.06 }, ka:1.85, ea0:1.15, cap:0.28, capB:0.4,
  // v5.5d : un seul combat par étage, donc moins de récompenses : le héros gagne un peu de force à chaque étage
  pg:0.028, heal:0.25, mpw:0.4, gk:2.5, gf:6, dmgCap:2.2, perkCap:0.7, redCap:0.75 };
function khMul(f, d, kind){ const b=BAL.kh, base=b.n0/(1+b.nk*(f-1)); if (!d.boss) return base; return base*(1+b.late*Math.max(0,f-35))*(f>=MAX_FLOOR?b.big*b.fin:isBigBoss(f)?b.big:b.boss); }
const Lf = lv => 1 + BAL.lv*(lv-1);
function eMul(f){ const r=Math.min(1,(f-1)/BAL.ramp), late=Math.max(0,f-10); return { h:Lf(f)*(BAL.h0+(1-BAL.h0)*r+BAL.hL*late), a:Lf(f)*(BAL.a0+(1-BAL.a0)*r+BAL.aL*late) }; }

const A = (name, power, o={}) => Object.assign({kind:'atk', name, power, type:'phys'}, o);

const hpr = e => e.hp/e.maxhp;

    if (!e.sum2 && p<0.45){ e.sum2=true; return {kind:'summon', name:'Chœur du néant', key:'sylphe', n:1}; }
    if (p>0.7){ const c=e.t%4; return c===3 ? A('Ombre dévorante',3.6,{windup:1, type:'mag'}) : c===1 ? A('Écho',0.8,{type:'mag', dot:[0.4,3]}) : A('Lame du néant',1.1); }
    if (p>0.35){ const c=e.t%5;
      if (c===0) return {kind:'shield', name:'Voile du néant', pct:0.18};
      if (c===2) return A('Ultima naissante',2.8,{windup:1, type:'mag', shieldAmp:true, interruptible:true});
      if (c===4) return A('Ombre dévorante',3.6,{windup:1, type:'mag'});
      return A('Lame du néant',1.1); }
    return e.t%2===0 ? A('Néant absolu',3.8,{windup:1, type:'mag'}) : A('Lame du néant',1.2,{weaken:2});
  },
};

const pomCount = id => R.taken.filter(x=>x===id).length;
function rollPoms(n, bonus){
  const pool = POMS.filter(p=>!(p.max && pomCount(p.id)>=p.max) && !(p.id==='potions'&&R.potions>=5) && !(p.id==='ether'&&R.ethers>=3));
  const wt = p => p.w*(bonus && GOOD_POMS.includes(p.id) ? 2 : 1);
  const out=[];
  while(out.length<n && pool.length){
    let r=rand()*pool.reduce((s,p)=>s+wt(p),0);
    for(let i=0;i<pool.length;i++){ r-=wt(pool[i]); if(r<=0){ out.push(pool[i]); pool.splice(i,1); break; } }
  }
  return out;
}

const rewCount = id => R.taken.filter(x=>x===id).length;
const rewOK = x => !(x.max && rewCount(x.id)>=x.max) && !(x.req && !x.req());
/* Tirage : n récompenses distinctes, rareté selon la profondeur et le type de combat */
function rollRarity(kind){
  const f=R.floor, b = kind==='boss'?0.2 : (kind==='elite'||kind==='mimic')?0.1 : 0;
  const ep = Math.min(0.2, 0.02 + 0.0025*f + b*0.5 + (R.curse&&R.curse.loot?0.08:0));
  const ra = Math.min(0.4, 0.18 + 0.004*f + b*0.8);
  if (kind==='shrine') return rand()<0.3+0.004*f ? 'e' : 'r';
  if (kind==='shrineE') return 'e';
  const x=rand(); return x<ep ? 'e' : x<ep+ra ? 'r' : 'c';
}
function drawRewards(n, kind, excl=[]){
  const out=[];
  for (let i=0;i<n;i++){
    let r=rollRarity(kind), pool=[];
    for (const t of [r, r==='e'?'r':r==='r'?'c':'r', 'c']){ pool=REWARDS.filter(x=>x.r===t && rewOK(x) && !out.includes(x) && !excl.includes(x.id)); if(pool.length) break; }
    if (!pool.length) break;
    out.push(pick(pool));
  }
  return out;
}

  else if (sf.invuln||sf.shield||sf.holm) t.push(chip('shield',''));
  if (sf.buff||sf.nextCrit) t.push(chip('up',''));

/* Rôle court affiché sur le bouton */
const SK_ROLE = { dmg:['Dégâts','r-dmg'], heal:['Soin','r-heal'], def:['Bouclier','r-def'], buff:['Buff','r-buff'], ctl:['Contrôle','r-ctl'] };
function skillRole(s){
  const sf=s.self||{};
  if (s.stun) return SK_ROLE.ctl;
  if (s.power) return SK_ROLE.dmg;
  if (sf.mitig||sf.shield||sf.invuln||sf.holm) return SK_ROLE.def;
  if (sf.heal||sf.healPct||sf.regen) return SK_ROLE.heal;
  return SK_ROLE.buff;
}
/* Valeurs réelles (avec tes statistiques actuelles) */
function skEst(s){
  const sf=s.self||{}, stat=(s.stat==='mag'?R.mag:R.atk), inC=!!(typeof C!=='undefined'&&C&&C.st);
  const bon = inC ? dmgBonus() : Math.max(0.2, 1+softCap(R.mods.dmg,0.15));
  const o={};
  if (s.power){ o.hit=Math.max(1,Math.round(stat*s.power*bon)); o.hits=s.hits||1; }
  if (s.dot) o.dot=Math.max(1,Math.round(stat*s.dot[0]*bon*(1+pk('dotUp'))));
  if (sf.heal) o.heal=Math.round(R.mag*sf.heal);
  if (sf.healPct) o.heal=(o.heal||0)+Math.round(R.maxhp*sf.healPct);
  if (sf.shield) o.shield=Math.round(R.maxhp*sf.shield);
  if (sf.regen) o.regen=Math.round(R.maxhp*sf.regen[0]);
  return o;
}
function skMain(s){
  const sf=s.self||{}, e=skEst(s);
  if (e.hit) return (e.hits>1?e.hits+'×':'')+e.hit+(s.target==='all'?' à tous':' dég.');
  if (sf.mitig) return '−'+Math.round(sf.mitig[0]*100)+' % · '+sf.mitig[1]+' t';
  if (e.shield) return 'Bouclier '+e.shield;
  if (e.heal) return '+'+e.heal+' PV';
  if (sf.invuln) return 'Immunité · '+sf.invuln+' t';
  if (sf.holm) return 'PV ≥ 1 · '+sf.holm+' t';
  if (sf.buff) return '+'+Math.round(sf.buff[0]*100)+' % · '+sf.buff[1]+' t';
  if (e.regen) return '+'+e.regen+'/t';
  if (sf.mpGain) return '+'+sf.mpGain+' PM';
  return '';
}
function skillDetail(s){
  const sf=s.self||{}, e=skEst(s), L=[], g=JOBS[R.job].gauge||'Sen';
  const tgt = s.target==='all' ? 'Tous les ennemis' : s.target==='self' ? 'Toi' : 'Un ennemi';
  L.push(`<span class="dt">Cible</span> ${tgt}`);
  if (e.hit) L.push(`<span class="dt">Dégâts</span> environ <b>${e.hit}</b>${e.hits>1?` × ${e.hits} coups`:''}${s.target==='all'?' sur chaque ennemi':''} (${s.stat==='mag'?'magiques':'physiques'})`);
  if (e.dot) L.push(`<span class="dt">Sur la durée</span> <b>${e.dot}</b> par tour pendant ${s.dot[1]} tours`);
  if (s.stun) L.push(`<span class="dt">Contrôle</span> étourdit ${s.stun} tour (sauf gardiens et boss, sauf sorts ${ic('bolt')})`);
  if (e.heal) L.push(`<span class="dt">Soin</span> <b>+${e.heal} PV</b>`);
  if (e.regen) L.push(`<span class="dt">Régénération</span> <b>+${e.regen} PV</b> par tour pendant ${sf.regen[1]} tours`);
  if (e.shield) L.push(`<span class="dt">Bouclier</span> absorbe <b>${e.shield} PV</b> de dégâts`);
  if (sf.mitig) L.push(`<span class="dt">Défense</span> <b>−${Math.round(sf.mitig[0]*100)} %</b> de dégâts subis pendant ${sf.mitig[1]} tour${sf.mitig[1]>1?'s':''}`);
  if (sf.invuln) L.push(`<span class="dt">Défense</span> aucun dégât pendant ${sf.invuln} tour`);
  if (sf.holm) L.push(`<span class="dt">Défense</span> PV jamais sous 1 pendant ${sf.holm} tours`);
  if (sf.buff) L.push(`<span class="dt">Bonus</span> <b>+${Math.round(sf.buff[0]*100)} %</b> de dégâts pendant ${sf.buff[1]} tours`);
  if (sf.nextCrit) L.push(`<span class="dt">Bonus</span> prochain coup critique`);
  if (sf.mpGain) L.push(`<span class="dt">PM</span> rend <b>${sf.mpGain} PM</b>`);
  if (sf.cleanse) L.push(`<span class="dt">Purifie</span> retire poison et affaiblissement`);
  if (s.sen) L.push(`<span class="dt">${g}</span> +${s.sen}`);
  const cost = s.mp ? `${mpCost(s)} PM` : s.req ? `${s.req} ${g}` : 'Aucun';
  L.push(`<span class="dt">Coût</span> ${cost}${s.cd?` · <span class="dt">Recharge</span> ${Math.max(1,s.cd-(R.mods.cdr||0))} tours`:''}`);
  return `<b>${s.name}</b> <span class="rtag ${skillRole(s)[1]}">${skillRole(s)[0]}</span><div class="tdesc">${s.desc||''}</div><div class="tlines">${L.map(x=>`<div>${x}</div>`).join('')}</div>`;
}
function skillTip(s){ return `<b>${s.name}</b><div class="tchips">${skillTag(s)}</div>${s.desc||''}`.replace(/"/g,'&quot;'); }
function skillListHTML(k, only){
  const list = only ? [JOBS[k].basic].concat(JOBS[k].opts.filter(o=>only.includes(o.id))) : allSkills(k);
  return `<div class="sklist">${list.map((s,i)=>`<div class="it"><b>${s.name}</b>${i===0?' <span class="tag">Base</span>':''} <span class="muted">${skillTag(s)}</span><br>${s.desc}</div>`).join('')}</div>`;
}
function skillLite(k, s){
  const j=JOBS[k], sf=s.self||{}, st=(s.stat==='mag'||s.type==='mag')?j.mag:j.atk;
  let num='', ico='sword', txt='';
  if (s.power){ num=Math.round(s.power*(s.hits||1)*st)+' dégâts'; ico=(s.stat==='mag'||s.type==='mag')?'magic':'sword'; }
  if (s.target==='all'){ ico='zone'; txt='Frappe tous les ennemis.'; }
  else if (s.hits>1) txt='Enchaîne plusieurs coups rapides.';
  else if (s.power) txt=(s.stat==='mag'||s.type==='mag')?'Frappe un ennemi par magie.':'Frappe un ennemi.';
  if (s.stun){ ico='bolt'; txt=s.power?'Frappe et étourdit l’ennemi.':'Étourdit l’ennemi.'; }
  if (s.dot){ ico='poison'; txt=s.power?'Frappe et empoisonne l’ennemi.':'Empoisonne l’ennemi.'; }
  if (sf.healPct||sf.heal){ const h=sf.healPct?Math.round(sf.healPct*100)+' % PV':Math.round(sf.heal*j.mag)+' PV'; if(!s.power){ num='Soin '+h; ico='heal'; txt='Te soigne.'; } else txt=txt.replace(/\.$/,'')+' et te soigne.'; }
  if (sf.regen && !s.power){ ico='heal'; num=num||'Régén.'; txt='Soigne un peu à chaque tour.'; }
  if (sf.mitig && !s.power){ ico='shield'; num='−'+Math.round(sf.mitig[0]*100)+' % dégâts'; txt='Réduit les dégâts reçus.'; }
  if (sf.invuln){ ico='shield'; num='Invulnérable'; txt='Aucun dégât pendant un tour.'; }
  if ((sf.shield||sf.holm) && !s.power){ ico='shield'; num=num||'Bouclier'; txt='Crée un bouclier protecteur.'; }
  if ((sf.buff||sf.nextCrit) && !s.power){ ico='up'; num=sf.buff?'+'+Math.round((Array.isArray(sf.buff)?sf.buff[0]:sf.buff)*100)+' % dégâts':'Critique'; txt=sf.nextCrit?'Ton prochain coup sera critique.':'Augmente tes dégâts un moment.'; }
  if (sf.mpGain && !s.power && !sf.buff){ ico='drop'; num='+PM'; txt='Rend des PM.'; }
  if (sf.cleanse && !s.power && !txt){ ico='heal'; txt='Retire les effets négatifs.'; }
  if (!txt) txt=(s.desc||'').split(/[.:]/)[0].split(' ').slice(0,8).join(' ')+'.';
  return `<div class="sk-lite"><span class="sk-ic">${ic(ico)}</span><div class="sk-t"><b>${s.name}</b><span>${txt}</span></div>${num?`<em>${num}</em>`:''}</div>`;
}
function skillLiteList(k){ return `<div class="sklite">${allSkills(k).map(s=>skillLite(k,s)).join('')}</div>`; }
function jobStatsHTML(k){
  const j=JOBS[k];
  return `<div class="grid2" style="gap:2px 14px">
    <div class="stat"><span>PV</span><b>${j.hp}</b></div><div class="stat"><span>PM</span><b>${j.mp}</b></div>

}

SCREENS.ranking = function(){
  C=null;
  app.innerHTML = `<div class="win topbar"><b class="grow">Classement</b></div>
  <div class="scroll"><p class="rk-intro">Les 3 meilleures explorations de chaque joueur, classées par étage atteint.</p><div class="rk-list" id="rkL"><p class="muted center">Chargement…</p></div></div>`;
  backIcon('hub');
  const box=document.getElementById('rkL');
  if (typeof Online==='undefined' || !Online.fetchTop3){ box.innerHTML='<p class="muted center">Classement indisponible.</p>'; return; }
  Online.fetchTop3().then(rows=>{
    if (!document.body.contains(box)) return;
    if (!rows.length){ box.innerHTML='<p class="muted center">Aucune exploration enregistrée pour l’instant. Connecte-toi à un compte et termine une exploration pour apparaître ici.</p>'; return; }
    const me=Online.myUserId, by={};
    rows.forEach(r=>{ (by[r.user_id]=by[r.user_id]||[]).push(r); });
    const cmp=(a,b)=>(b.floor-a.floor)||(b.score-a.score)||((a.duration_s||0)-(b.duration_s||0));
    const players=Object.values(by).map(L=>L.sort(cmp)).sort((a,b)=>cmp(a[0],b[0]));
    const fmtD=s=>{ s=Math.max(0,s|0); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?`${h} h ${String(m).padStart(2,'0')}`:`${m} min`; };
    box.innerHTML = players.map((L,pi)=>`<div class="rk-g${L[0].user_id===me?' me':''}">${L.map((r,ri)=>`
      <div class="rk-r${ri===0?' first':''}">
        <span class="rk-n">${ri===0?pi+1:''}</span>
        <span class="rk-sp">${spr(JOBS[r.job]?r.job:'paladin','')}</span>
        <span class="rk-t"><b>${esc(r.pseudo||'?')}${L[0].user_id===me&&ri===0?' <i class="rk-you">toi</i>':''}</b><small>${JOBS[r.job]?JOBS[r.job].name:esc(r.job)}${r.mode==='duo'?` · ${r.party_size===3?'Trio':'Duo'}`:''}</small></span>
        <span class="rk-f"><b>${r.victory&&r.floor>=50?'Victoire':'Étage '+r.floor}</b><small>${(r.score||0).toLocaleString('fr-FR')} pts · ${fmtD(r.duration_s)}</small></span>
      </div>`).join('')}</div>`).join('');
  }).catch(()=>{ if (document.body.contains(box)) box.innerHTML='<p class="muted center">Classement indisponible pour le moment. Vérifie ta connexion.</p>'; });
};

function makeEnemy(key, kind){

    gils, ai:d.ai, boss:!!d.boss, support:!!d.support, t:0, dots:[], stunT:0, shield:0, buff:0, buffT:0, rage:0, flyT:0,
    enrageAt: (d.boss ? ENRAGE_AT[key] : (el ? BAL.elite.enrage : 0)) ? (d.boss ? ENRAGE_AT[key] : BAL.elite.enrage) + pk('enrageDelay') : 0, pending:null, intent:null, dead:false,
    uid:'e'+(++R.uidn||(R.uidn=1)) };
}
function startCombat(kind){

    if (kind==='elite') n=Math.max(2,n);

function curTarget(){ let e=C.enemies[C.target]; if(!e||e.dead){ e=alive()[0]; C.target=C.enemies.indexOf(e); } return e; }
/* Disposition du champ de bataille : ennemis en échelon à droite (avant = bas, près du centre) */
const EN_SLOTS={1:[[46,16,1]],2:[[30,8,1],[70,34,.9]],3:[[24,4,1],[56,28,.92],[78,54,.84]],
  4:[[22,0,1],[66,10,.96],[34,40,.9],[76,52,.86]],5:[[20,0,1],[64,6,.97],[30,36,.9],[76,44,.88],[50,70,.8]]};
const EN_ADDS=[[16,0,.9],[20,52,.82],[6,26,.86],[40,66,.78]];
/* Placement en colonnes (v5.4g) : ennemis en colonne verticale à droite (2 colonnes serrées à partir de 4),
   perspective uniquement par la taille : rangée du fond (haut) plus petite, rangée de devant (bas) plus grande et au premier plan.
   Retour : [x %, bas %, échelle, z-index] dans la zone ennemie. */
const COL_ROWS = k => k<=1 ? [26] : k===2 ? [4,50] : [0,33,64];
const rowScale = (j,k) => k<=1 ? 1 : [1,0.9,0.8][j]||0.8;
function colPlace(k, x){ const ys=COL_ROWS(k); return ys.map((y,j)=>[x, y, rowScale(j,k), 50-j*10]); }
function enSlot(i,n,list){
  const b=list.findIndex(z=>z.boss);
  if (b>=0){
    if (n===1) return [52,8,1,40];
    if (i===b) return [n>=5?77:64,10,1,20];
    const adds=list.filter(z=>!z.boss).length, j=list.slice(0,i).filter(z=>!z.boss).length;
    if (adds<=3){ const p=colPlace(adds, 13)[j]; return [p[0],p[1],p[2]*0.85,p[3]+20]; }
    const fr=Math.ceil(adds/2), p = j<fr ? colPlace(fr,9)[j] : colPlace(adds-fr,37)[j-fr];
    return [p[0], (j>=fr && adds-fr<fr) ? [16,48][j-fr] : p[1], p[2]*0.75, p[3]+(j<fr?25:20)];
  }
  let p;
  if (n<=3) p=colPlace(n,52)[i];
  else { const front=Math.ceil(n/2), back=n-front;
    p = i<front ? colPlace(front,28)[i] : colPlace(back,76)[i-front];
    if (i>=front && back<front){ p=p.slice(); p[1]=[16,48][i-front]; }
    if (i>=front){ p=p.slice(); p[2]*=0.94; p[3]-=5; } }
  return p;
}

/* --- effets visuels --- */
function elCenter(el){

  const b=f.getBoundingClientRect(); const img=el.querySelector('img.spr:not(.cursor)')||el; const c=img.getBoundingClientRect();

function floatAt(el, text, cls=''){

  const d=document.createElement('div'); d.className='float '+cls; d.textContent=text; d.style.left=p.x+'px'; d.style.top=(p.y-20)+'px';

}
const FX_COL = { slash:'255,255,255', holy:'255,250,200', fire:'255,120,40', ice:'140,220,255', thunder:'200,160,255', stone:'200,170,120', wind:'140,255,170',
  poison:'150,230,80', dark:'170,80,220', arrow:'255,240,180', chakra:'255,200,80', jump:'120,150,255', heal:'120,255,140', shield:'120,180,255', enemy:'255,60,60' };
function fxAt(el, kind){
  if (FAST) return;
  const f=document.getElementById('field'); if(!f||!el) return; const p=elCenter(el);
  const c=FX_COL[kind]||FX_COL.slash; const d=document.createElement('div'); d.className='fx';
  d.style.cssText=`left:${p.x}px;top:${p.y}px;background:radial-gradient(circle,rgba(${c},.95) 0%,rgba(${c},.35) 45%,transparent 70%)`;

}
function anim(el, cls, ms=350){ if(FAST||!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),ms); }
const enEl = e => document.getElementById('en-'+e.uid);
let plEl = () => document.getElementById('player');
/* --- calculs --- */
const mpCost = s => Math.round((s.mp||0)*(1-pk('mpSave')));
const softCap = (x, k, m=0.5) => x<=k ? x : k + (x-k)*m; /* rendements décroissants */
const dmgBonus = () => clamp(1 + softCap(R.mods.dmg, 0.15) + (C.st.buffT>0?C.st.buff:0) - (C.st.weakT>0?0.25:0), 0.2, BAL.dmgCap);
const skType = s => s.type || (s.stat==='mag'?'mag':'phys');
function enemyMul(e, type){ let r=e.res[type]||0; if (r>0) r*=(1-pk('pierce')); if (e.resDown) r-=e.resDown; return Math.max(0.1, (1 - r) * (e.flyT>0?0.5:1)); }
function playerHit(s, e){
  const stat = s.stat==='mag' ? R.mag : R.atk;
  const crit = C.st.nextCrit ? true : rand() < (R.crit + R.mods.crit);
  const d = stat * s.power * dmgBonus() * perkMul(s, e) * rnd(0.92,1.08) * (crit?1.5+pk('critMul'):1) * enemyMul(e, skType(s));
  return {d:Math.max(1,Math.round(d)), crit};
}
function perkMul(s, e){
  if (!R.perk) return 1;
  const p=e.hp/e.maxhp, stunned=e.intent&&(e.intent.kind==='stun'||e.intent.kind==='interrupted');
  const sum = (p>0.8?pk('opener'):0) + (p<0.3?pk('execute'):0) + (e.shield>0?pk('vsShield'):0) + (e.support?pk('vsSupport'):0)
    + (e.boss?pk('boss'):0) + (stunned?pk('stunned'):0) + (s&&s.target==='all'?pk('aoe'):0) + (C.turn===0?pk('firstTurn'):0);
  return 1 + Math.min(BAL.perkCap, softCap(sum, 0.4)); // v5.5d : les bonus conditionnels ne s'additionnent plus sans limite
}
function damageEnemy(e, d, crit){
  let absorbed=0;
  if (e.shield>0){ absorbed=Math.min(e.shield,d); e.shield-=absorbed; d-=absorbed; if(e.shield<=0){ e.shield=0; floatAt(enEl(e),'Bouclier brisé !','info'); } }
  e.hp = Math.max(0, e.hp - d);
  const el=enEl(e); floatAt(el, (crit? (d+absorbed)+' !' : String(d+absorbed)), crit?'crit':''); anim(el,'hit',260); anim(el,'shake',300);
  if (R.mods.vamp>0) healR((d+absorbed)*R.mods.vamp);
  if (e.hp<=0 && !e.dead) killEnemy(e);
}
function killEnemy(e){
  e.dead=true; R.kills++;
  const g=gainGils(e.gils);
  const el=enEl(e); if(el){ floatAt(el, `+${g} G`, 'info'); el.classList.add('dead'); }
  if (pk('gilKill')) gainGils(pk('gilKill'));
  if (pk('hpKill')) healR(R.maxhp*pk('hpKill'));
  if (pk('mpKill')) R.mp=Math.min(R.maxmp, R.mp+pk('mpKill'));
  if (pk('cdrKill')) Object.keys(C.cds).forEach(k=>{ if(C.cds[k]>0) C.cds[k]--; });
}
function damagePlayer(raw, x){
  const st=C.st, pel=plEl();
  if (st.invulnT>0){ floatAt(pel,'Esquive !','info'); return 0; }
  if (x && x.big && st.absorb>0){ st.absorb=0; floatAt(pel,'Absorbé !','info'); fxAt(pel,'shield'); return 0; }
  const red = Math.min(BAL.redCap, 1 - (1-effDef()) * (1-(st.mitigT>0?st.mitig:0)) * (1-(x&&x.big?pk('bigRed'):0)) * (1-(x&&x.type==='mag'?pk('magRed'):0)));
  let d = Math.max(1, Math.round(raw * (1-red))); // v5.5d : réduction totale des dégâts plafonnée
  d = Math.min(d, Math.max(1, Math.round(R.maxhp*((C.enemies||[]).some(e=>e.boss&&!e.dead)?BAL.capB:BAL.cap)))); // jamais tué d'un seul coup
  if (st.shield>0){ const a=Math.min(st.shield,d); st.shield-=a; d-=a; if(a>0) floatAt(pel,`Bouclier −${a}`,'mp'); }
  if (d>0){

    if (st.holmT>0 && R.hp<1){ R.hp=1; floatAt(pel,'Holmgang !','info'); }
    floatAt(pel, String(d), 'bad');
    anim(pel,'hit',260); const f=document.getElementById('field'); anim(f,'shake',300); anim(f,'redflash',360);

}
function applyStun(e, turns){
  const el=enEl(e);
  if (e.boss){
    if (canInterrupt(e)){ e.pending=null; e.intent={kind:'interrupted'}; e.t++; floatAt(el,'Interrompu !','info'); onInterrupt(e); }
    else floatAt(el,'Insensible','info');
    return;
  }
  const wasBig = e.intent && (e.intent.big||e.intent.kind==='charge');
  if (wasBig){ e.t++; onInterrupt(e); }
  e.stunT=turns; e.pending=null; e.intent={kind:'stun'}; floatAt(el, wasBig?'Interrompu !':'Étourdi !','info');
}
function onInterrupt(e){
  const n=pk('onInterrupt'); if(!n) return;
  healR(R.maxhp*0.08*n); const d=Math.round(Math.max(R.atk,R.mag)*0.8*n); e.hp=Math.max(0,e.hp-d); floatAt(enEl(e),String(d),'crit');
  if (e.hp<=0 && !e.dead) killEnemy(e);
}
/* --- tour du joueur --- */
async function playerAction(id){
  if (!C || C.busy) return;
  const pel=plEl(); let s=null;
  if (id==='__potion'){ if(!R.potions) return; }
  else if (id==='__ether'){ if(!R.ethers) return; }
  else { s=combatSkills().find(x=>x.id===id); if(!s) return; const ss=skillState(s); if(!ss.ok){ toast(ss.cd?`Recharge : encore ${ss.cd} tour(s)`:ss.why==='PM'?'Pas assez de PM':'Pas assez de '+ss.why); return; } }
  C.busy=true; renderSkills();
  if (id==='__potion'){ R.potions--; const h=Math.round(R.maxhp*potionPct()); healR(h); C.msg='Potion !'; fxAt(pel,'heal'); floatAt(pel,'+'+h,'heal'); updateCombat(); await sleep(450); }
  else if (id==='__ether'){ R.ethers--; const m=Math.round(R.maxmp*0.5); R.mp=Math.min(R.maxmp,R.mp+m); C.msg='Éther !'; fxAt(pel,'shield'); floatAt(pel,'+'+m+' PM','mp'); updateCombat(); await sleep(450); }
  else await useSkill(s);
  if (await checkEnd()) return;
  if (C.cp){ await compAct(); if (await checkEnd()) return; }
  await enemyPhase();
  if (await checkEnd()) return;
  startPlayerTurn();
  await checkEnd();
}
async function useSkill(s){
  const st=C.st, pel=plEl();
  if (s.mp) R.mp-=mpCost(s);
  if (s.cd) C.cds[s.id] = Math.max(1, s.cd - R.mods.cdr);
  if (s.req) st.sen -= s.req;
  C.msg = `${esc(R.pname||S.name)} utilise <b>${s.name}</b> !`;
  updateCombat();
  anim(plEl(), (s.target==='self' || s.stat==='mag') ? 'cast' : 'lunge', 400);
  await sleep(220);
  if (s.power){
    const targets = s.target==='all' ? alive() : [curTarget()];
    const hits = s.hits||1;
    for (let h=0; h<hits; h++){
      for (const e of targets){
        if (e.dead) continue;
        const r = playerHit(s, e);
        fxAt(enEl(e), s.fx); damageEnemy(e, r.d, r.crit);
        if (s.dot && !e.dead && h===0){ const stat=s.stat==='mag'?R.mag:R.atk; e.dots=e.dots.filter(d=>d.src!==s.id); e.dots.push({src:s.id, dmg:Math.max(1,Math.round(stat*s.dot[0]*dmgBonus()*(1+pk('dotUp'))*Math.max(0.5,1-(e.res[skType(s)]||0)*0.5))), t:s.dot[1]}); }
        if (s.stun && !e.dead && h===0) applyStun(e, s.stun);
      }
      if (hits>1){ updateCombat(); await sleep(200); }
    }
    st.nextCrit=0;
  }
  if (s.sen) st.sen = Math.min(3, st.sen + s.sen);
  const x = s.self;
  if (x){
    if (x.heal){ const h=Math.round(R.mag*x.heal*rnd(0.95,1.05)); const b=R.hp; healR(h); fxAt(pel,'heal'); floatAt(pel,'+'+Math.round(R.hp-b),'heal'); }
    if (x.healPct){ const b=R.hp; healR(R.maxhp*x.healPct); fxAt(pel,'heal'); floatAt(pel,'+'+Math.round(R.hp-b),'heal'); }
    if (x.shield){ st.shield = Math.max(st.shield, Math.round(R.maxhp*x.shield)); fxAt(pel,'shield'); floatAt(pel,'Bouclier','mp'); }
    // v5.5d : un même effet se rafraîchit (durée remise à neuf) au lieu de s'additionner ; on garde la valeur la plus forte
    if (x.mitig){ st.mitig=Math.max(st.mitigT>0?st.mitig:0, x.mitig[0]); st.mitigT=Math.max(st.mitigT, x.mitig[1]); fxAt(pel,'shield'); floatAt(pel,s.name,'info'); }
    if (x.invuln){ st.invulnT=Math.max(st.invulnT,x.invuln); fxAt(pel,'holy'); floatAt(pel,'Invincible !','info'); }
    if (x.holm){ st.holmT=Math.max(st.holmT,x.holm); fxAt(pel,'shield'); floatAt(pel,'Holmgang','info'); }
    if (x.regen){ st.regen=Math.max(st.regenT>0?st.regen:0, x.regen[0]); st.regenT=Math.max(st.regenT, x.regen[1]); }
    if (x.buff){ st.buff=Math.max(st.buffT>0?st.buff:0, x.buff[0]); st.buffT=Math.max(st.buffT, x.buff[1]); fxAt(pel,'fire'); floatAt(pel,'Puissance !','info'); }
    if (x.nextCrit){ st.nextCrit=1; }
    if (x.mpGain){ R.mp=Math.min(R.maxmp, R.mp+x.mpGain); floatAt(pel,'+'+x.mpGain+' PM','mp'); }
    if (x.cleanse){ st.weakT=0; st.pdotT=0; }
  }
  updateCombat();
  await sleep(420);
}
async function enemyPhase(){
  for (const e of alive()){ // dégâts continus
    if (!e.dots.length) continue;
    let tot=0; e.dots.forEach(d=>{ tot+=d.dmg; d.t--; }); e.dots=e.dots.filter(d=>d.t>0);
    e.hp=Math.max(0,e.hp-tot); floatAt(enEl(e), String(tot), 'dot');
    if (e.hp<=0) killEnemy(e);
  }
  updateCombat();
  if (alive().length===0) return;
  await sleep(300);
  for (const e of alive()){
    if (e.dead) continue;
    await enemyAct(e);
    if (e.buffT>0) e.buffT--;
    if (e.weakT>0) e.weakT--;
    updateCombat();
    if (R.hp<=0) break;
    await sleep(380);
  }
  const st=C.st;
  ['mitigT','invulnT','holmT','buffT','weakT'].forEach(k=>{ if(st[k]>0) st[k]--; });
}
async function enemyAct(e){
  const x=e.intent||A('Attaque',1);
  const el=enEl(e), pel=plEl();
  if (x.kind==='stun'){ e.stunT=Math.max(0,e.stunT-1); C.msg=`${e.name} est étourdi.`; return; }
  if (x.kind==='interrupted'){ C.msg=`${e.name} a été interrompu !`; return; }
  e.t++;
  if (e.flyT>0) e.flyT--;
  if (x.kind==='charge'){ e.pending = Object.assign({}, x.then, {big:true}); C.msg=`${e.name} prépare <b>${x.then.name}</b>…`; anim(el,'cast',400); fxAt(el,'enemy'); return; }
  if (x.kind==='heal'){
    const tg = (x.target && C.enemies.find(z=>z.uid===x.target && !z.dead)) || e;
    const h=Math.round(tg.maxhp*x.pct); tg.hp=Math.min(tg.maxhp,tg.hp+h); C.msg=`${e.name} utilise ${x.name}${tg!==e?' sur '+tg.name:''}.`; fxAt(enEl(tg),'heal'); floatAt(enEl(tg),'+'+h,'heal'); return; }
  if (x.kind==='buffAll'){ alive().forEach(z=>{ z.buff=x.pct; z.buffT=x.turns+(z===e?1:0); }); C.msg=`${e.name} utilise <b>${x.name}</b> ! Ennemis +${Math.round(x.pct*100)} % de dégâts.`; fxAt(el,'fire'); return; }
  if (x.kind==='shield'){ e.shield=Math.round(e.maxhp*x.pct); C.msg=`${e.name} utilise ${x.name} !`; fxAt(el,'shield'); floatAt(el,'Bouclier','info'); return; }
  if (x.kind==='fly'){ e.flyT=x.turns; C.msg=`${e.name} s’envole ! (−50 % de dégâts reçus)`; anim(el,'cast',400); return; }
  if (x.kind==='summon'){
    C.msg=`${e.name} utilise <b>${x.name}</b> !`; anim(el,'cast',400);
    C.enemies = C.enemies.filter(z=>!z.dead);
    const n = Math.min(x.n, 3-C.enemies.length);
    for (let i=0;i<n;i++){ const m=makeEnemy(x.key,'normal'); m.gils=1; m.hp=m.maxhp=Math.round(m.maxhp*0.6); m.hp=m.maxhp=Math.round(m.maxhp*0.6); C.enemies.push(m); planIntentFor(m); }
    C.target=Math.max(0, C.enemies.findIndex(z=>!z.boss)); updateCombat(); return;
  }
  C.msg = `${e.name} utilise <b>${x.name}</b> !`;
  anim(el, 'cast', 300); await sleep(160);
  fxAt(pel, 'enemy');
  const dealt = damagePlayer(eAtk(e) * intentPower(e,x) * rnd(0.9,1.1), x);
  if (dealt>0 && pk('thorns') && !e.dead){ const t=Math.max(1,Math.round(dealt*pk('thorns'))); e.hp=Math.max(0,e.hp-t); floatAt(el,String(t),'dot'); if(e.hp<=0){ killEnemy(e); return; } }

  if (x.land) e.flyT=0;
  if (x.drain){ const h=Math.round(e.maxhp*x.drain); e.hp=Math.min(e.maxhp,e.hp+h); floatAt(el,'+'+h,'heal'); }
  if (x.weaken && C.st.invulnT<=0 && !pk('noWeak')){ C.st.weakT = x.weaken+1; floatAt(pel,'Affaibli','info'); }

  if (x.selfDestruct){ e.hp=0; e.dead=true; if(el) el.classList.add('dead'); C.msg += ' Il se désintègre.'; }
}
function planIntentFor(e){
  if (e.dead) return;
  if (e.stunT>0){ e.intent={kind:'stun'}; return; }
  if (e.pending){ e.intent=e.pending; e.pending=null; return; }
  const a = AI[e.ai](e);
  if (a.windup){ const then=Object.assign({},a); delete then.windup; e.intent={kind:'charge', then}; }
  else e.intent=a;

function planIntents(){ alive().forEach(planIntentFor); }
function startPlayerTurn(){
  const st=C.st, pel=plEl();

  R.mp = Math.min(R.maxmp, R.mp + Math.round((2 + R.maxmp*0.04)*(1+R.mods.mpr)));
  if (st.regenT>0){ const h=Math.round(R.maxhp*st.regen); healR(h); st.regenT--; floatAt(pel,'+'+h,'heal'); }
  if (pk('regen')>0 && R.hp>0) healR(R.maxhp*pk('regen'));

async function checkEnd(){

  if (R.hp<=0){
    C.ending=true; R.hp=0; C.busy=true; C.msg='Tu t’effondres…'; updateCombat();
    const pel=plEl(); if(pel && !FAST){ pel.style.transition='all .6s'; pel.style.filter='grayscale(1)'; pel.style.transform='rotate(90deg)'; }
    await sleep(1100); endRun(false); return true;
  }
  if (alive().length===0){
    C.ending=true; C.busy=true; C.msg='Victoire !'; updateCombat();
    await sleep(600); winCombat(); return true;
  }
  return false;
}
function tryRevive(){
  const pel=plEl();

}
function fragDrop(kind){

function winCombat(){
  const kind=C.kind, g0=C.g0; C=null; R.inC=0; R.fs=null;
  if (kind==='boss') R.bosses=(R.bosses||0)+1;
  if (!R.lvB){ R.lvB=1; partyLevel(); } // premier combat gagné : niveau +1 (progression rapide au début)
  healR(R.maxhp*(R.curse&&R.curse.noHeal?0:BAL.heal)); R.mp=Math.min(R.maxmp, R.mp+Math.round(R.maxmp*BAL.mpw));
  const fr=fragDrop(kind);
  if (kind==='boss' && R.floor===MAX_FLOOR) return endRun(true);
  const extra = victoryHTML(kind, R.gilsEarned-(g0==null?R.gilsEarned:g0), fr);
  if (kind==='boss'){ healR(R.maxhp*(isBigBoss(R.floor)?1:0.5)); R.mp=R.maxmp; return fightRewards('boss', isBigBoss(R.floor)?'Boss vaincu !':'Gardien vaincu !', extra); }
  fightRewards(kind, 'Combat terminé', extra);
}

function giveOneScreen(title, text, kind, icon){
  const x=drawRewards(1,kind)[0]; if(!x){ const g=gainGils(10+2*R.floor); return eventScreen(title, icon, `${text}<br>Tu gagnes <span class="gold">${g} Gils</span>.`); }
  takeReward(x); const rr={c:'Commune',r:'Rare',e:'Épique'}[x.r]||'';
  eventScreen(title, icon, `${text}<br>Tu obtiens : <b>${x.name}</b>${rr?` <span class="rar r-${x.r}">${rr}</span>`:''}<br><span class="muted">${x.desc}</span>`);
}
function pickRewardsScreen(title, text, opts, icon){
  // Choix fixe (sans relance) : autels, pomandres, entraînement
  if (!opts.length){ return eventScreen(title, icon||'icon_autel', text+'<br><span class="muted">…mais il n’y a plus rien à gagner ici.</span>'); }
  R.rew = { kind:'fixed', title, extra:`<div class="win center"><p>${text}</p></div>`, opts:opts.map(x=>x.id), rr:0, fixed:true };

}

  barde:{phys:0.25,mag:0.05}, samourai:{phys:0.1,mag:0}, mageblanc:{phys:-0.1,mag:0.2}, magenoir:{phys:-0.1,mag:0.25}, erudit:{phys:0,mag:0.25}, magerouge:{phys:0.05,mag:0.15} };

function trapChance(t){
  let c = 0.55 + ((JOB_TRAP[R.job]||{})[t.type]||0);
  if (R.comp && ['thancred','locke','zidane'].includes(R.comp.id)) c += 0.15;
  if (R.floor<=3) c += 0.15;
  return clamp(c, 0.15, 0.95);
}
function trapLoot(){
  const r=rand();
  if (r<0.12){ R.frags=(R.frags||0)+1; return `Dans le mécanisme brille un <b>Fragment de cristal</b> ${ic('gem')}.`; }
  if (r<0.45){ const g=gainGils(10+2*R.floor); return `Tu récupères <span class="gold">${g} Gils</span> cachés dans le mécanisme.`; }
  if (r<0.7 && R.potions<5){ R.potions++; return 'Tu récupères une <b>Potion</b> laissée par un aventurier malchanceux.'; }
  const x=drawRewards(1,'normal')[0]; if(!x) return 'Rien à récupérer.'; takeReward(x); return `Tu trouves : <b>${x.name}</b><br><span class="muted">${x.desc}</span>`;
}
function trapPenalty(t, k){
  const m = (isTank()?0.6:1) * (R.floor<=3?0.5:1) * k;
  const loss = Math.round(R.maxhp*t.hp*m); R.hp=Math.max(1, R.hp-loss);
  if (t.mp) R.mp=Math.max(0, Math.round(R.mp*(1-t.mp*k)));
  if (t.poison) R.nextPoison=1;
  return loss;
}

    {label:`Désamorcer — ${fmtPct(c)} de réussite`, sub:'Réussite : butin. Échec : '+(t.fight?'combat en position de faiblesse.':'pénalité.'), ai: (c*6 - (1-c)*(t.hp*30+(t.fight?4:0)+(t.mp?2:0))) + (hpPct()<0.35?-4:0),
      fn:()=>{ if (rand()<c){ eventScreen('Piège désamorcé !', 'icon_piege', trapLoot()); }
        else { const l=trapPenalty(t,1); if (t.fight){ R.nextWeak=1; return eventScreen('Échec…', 'icon_piege', t.fail, ()=>startCombat('normal'), 'Combattre !'); }
          eventScreen('Échec…', 'icon_piege', `${t.fail}${l?` <b style="color:#ff8080">−${l} PV</b>`:''}`); } }},
    {label:'Contourner prudemment', sub:`Sûr, mais long : −${safeLoss} PV, pas de butin.`, ai:0,

  ]);
};

    if (r<0.35){ const g=gainGils(8+2*R.floor); return eventScreen('Coffre au trésor', 'icon_coffre', `Tu trouves <span class="gold">${g} Gils</span> !`); }

  };
  const ch=[{label:'Ouvrir le coffre', sub:R.floor>=3?'Attention aux Mimiques…':'', ai: hpPct()>0.4?3:1, fn:open}];
  if (sharp) ch.push({label:'Examiner d’abord', sub:R.job==='barde'?'Ton œil de Barde repère les pièges.':`${COMPANIONS[R.comp.id].name} connaît les Mimiques.`, ai:4,

function compURL(k){
  const a=COMPANIONS[k].art;
  let head = (a.head ? HEADS[a.head] : COMP_HEADS[a.h]).map(r=>r.padEnd(16,'.').split(''));
  if (a.ears){ head[0][3]='K'; head[0][4]='K'; head[0][11]='K'; head[0][12]='K'; head[1][3]='K'; head[1][4]='H'; head[1][11]='H'; head[1][12]='K'; }
  const rows = head.concat(BODIES[a.body].map(r=>r.padEnd(16,'.').split('')));
  (a.w && WEAPONS[a.w] || []).forEach(([x,y,c])=>{ if(rows[y]) rows[y][x]=c; });
  return gridToURL(rows.map(r=>r.join('')), Object.assign({}, BASE_PAL, a.head?JOB_PAL[a.head]:{}, a.pal));
}
/* --- en combat --- */
const compPot = () => R && R.comp ? 1 + 0.08*(R.comp.rank-1) : 1;
const compCd = () => Math.max(2, COMP_KINDS[COMPANIONS[R.comp.id].kind] - (R.comp.rank>=5?1:0) - pk('compCd'));
const compAtk = () => 10*Lf(R.level)*(1+0.04*(R.comp.rank-1));
const bigIncoming = () => alive().some(e=>e.intent && e.intent.kind==='atk' && e.intent.big);
function compHit(e, power, type, o={}){
  if (!e || e.dead) return;
  let mul = o.pierceRes ? (e.flyT>0?0.5:1) : enemyMul(e, type||'phys');
  let d = Math.max(1, Math.round(compAtk()*power*rnd(0.92,1.08)*mul));
  const el=enEl(e);
  if (o.pierce && e.shield>0){ e.hp=Math.max(0,e.hp-d); floatAt(el,String(d),'crit'); if(e.hp<=0 && !e.dead) killEnemy(e); }
  else { const v=R.mods.vamp; R.mods.vamp=0; damageEnemy(e, d, false); R.mods.vamp=v; }
  fxAt(el, type==='mag'?'fire':'slash');
}
async function compAct(){
  const cp=C.cp, d=COMPANIONS[R.comp.id], pot=compPot(), st=C.st, cel=document.getElementById('comp'), pel=plEl();
  if (!alive().length) return;
  cp.cd--;
  const tgt=curTarget();
  let used=null;
  if (cp.cd<=0){
    let kind=d.kind;
    if (kind==='random') kind = bigIncoming() ? 'shield' : hpPct()<0.5 ? 'heal' : 'burst';
    const act = {
      interrupt:()=>{ const e=alive().find(x=>canInterrupt(x)); if(!e) return null; applyStun(e,1); compHit(e,0.5); return 'interrompt '+e.name; },
      heal:()=>{ if (hpPct()>=0.5) return null; const b=R.hp; healR(R.maxhp*0.18*pot); if(d.regen){ st.regen=Math.max(st.regen,0.05*pot); st.regenT=Math.max(st.regenT,2); } fxAt(pel,'heal'); floatAt(pel,'+'+Math.round(R.hp-b),'heal'); return 'te soigne'; },
      regen:()=>{ if (hpPct()>=0.75 || st.regenT>0) return null; st.regen=0.06*pot; st.regenT=3; fxAt(pel,'heal'); return 'lance une régénération'; },
      cleanse:()=>{ if (!(st.weakT>0||st.pdotT>0||hpPct()<0.45)) return null; st.weakT=0; st.pdotT=0; const b=R.hp; healR(R.maxhp*0.15*pot); fxAt(pel,'heal'); floatAt(pel,'+'+Math.round(R.hp-b),'heal'); return 'lance Esuna'; },
      shield:()=>{ if (!(bigIncoming()||hpPct()<0.4)) return null; st.shield=Math.max(st.shield, Math.round(R.maxhp*0.18*pot)); fxAt(pel,'shield'); floatAt(pel,'Bouclier','mp'); return 'te protège d’un bouclier'; },
      absorb:()=>{ if (!bigIncoming() || st.absorb>0) return null; st.absorb=1; fxAt(pel,'shield'); floatAt(pel,'Protégé','info'); return 'se prépare à encaisser l’attaque '+ic('warn')+''; },
      mitig:()=>{ if (!bigIncoming()) return null; st.mitig=Math.max(st.mitigT>0?st.mitig:0, Math.min(0.6,0.4*pot)); st.mitigT=Math.max(st.mitigT,1); fxAt(pel,'shield'); return 'te couvre'; },
      revive:()=>{ compHit(tgt,1.0*pot); return 'frappe à la rapière'; },
      burst:()=>{ if (d.dodge && !(bigIncoming()||cp.cd<=-2)) return null; compHit(tgt, (d.dodge?1.6:1.8)*pot, 'phys', d); if (d.dodge && bigIncoming()){ st.invulnT=Math.max(st.invulnT,1); floatAt(pel,'Esquive préparée','info'); } return 'déchaîne sa technique'; },
      aoe:()=>{ if (alive().length<2 && cp.cd>-1) return null; alive().forEach(e=>compHit(e,0.9*pot,'mag')); return 'lance un sort de zone'; },
      breakshield:()=>{ const e=alive().find(x=>x.shield>0) || (d.resDown && cp.cd<=-2 ? tgt : null); if(!e) return null; if(e.shield>0){ e.shield=0; floatAt(enEl(e),'Bouclier brisé !','info'); } if(d.resDown) e.resDown=0.2; compHit(e,0.8); return 'brise la garde de '+e.name; },
      delay:()=>{ const es=alive().filter(x=>x.enrageAt && x.enrageAt-x.t<=10); if(!es.length || cp.uses>=3) return null; es.forEach(x=>{ x.enrageAt+=2; floatAt(enEl(x),'Rage +2','info'); }); compHit(tgt,0.8,'mag'); return 'ralentit le temps'; },
      haste:()=>{ if (!Object.values(C.cds).some(v=>v>1)) return null; Object.keys(C.cds).forEach(k=>{ if(C.cds[k]>0) C.cds[k]--; }); floatAt(pel,'Hâte','info'); return 'te lance Hâte'; },
      mp:()=>{ if (hasMP()){ if (R.mp>=R.maxmp*0.4) return null; const m=Math.round(R.maxmp*0.35*pot); R.mp=Math.min(R.maxmp,R.mp+m); floatAt(pel,'+'+m+' PM','mp'); return 'te rend des PM'; }
        if (hpPct()>=0.5) return null; healR(R.maxhp*0.15*pot); fxAt(pel,'heal'); return 'te soigne'; },
      loot:()=>{ if (cp.uses>=1) return null; compHit(tgt,1.0); const g=gainGils(4+R.floor); floatAt(enEl(tgt)||pel,'+'+g+' G','info'); return 'vole '+g+' Gils'; },
      stagger:()=>{ const e=alive().find(x=>x.intent&&(x.intent.kind==='stun'||x.intent.kind==='interrupted')); if(!e) return null; compHit(e,2.2*pot); return 'frappe '+e.name+' sans défense'; },
    }[kind];
    const r = act ? act() : null;
    if (r){ used=r; cp.cd=compCd(); cp.uses++; }
  }
  if (!used){ compHit(tgt, 0.25); used='attaque'; }
  if (cel) anim(cel,'lunge',350);
  C.cmsg = used==='attaque' ? 'Attaque' : used.charAt(0).toUpperCase()+used.slice(1)+' !'; C.clog=(C.clog||0)+1; R.compActs=(R.compActs||0)+1;
  const bub=document.getElementById('cbub'); if(bub){ bub.textContent=C.cmsg; bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop'); }
  updateCombat();
  await sleep(380);
}
