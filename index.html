    st.initP = (async () => {
      const createClient = opts.createClient || await loadSdk();
      st.sb = createClient(CFG.url, CFG.key, Object.assign({ auth:{ storageKey:CFG.authKey, persistSession:!!HAS_DOM, autoRefreshToken:true, detectSessionInUrl:!!HAS_DOM } }, opts.clientOptions||{}));
      st.sb.auth.onAuthStateChange((ev, session) => { setTimeout(() => onSession(session, ev), 0); });
      const { data } = await st.sb.auth.getSession();
      await onSession(data && data.session, 'INITIAL');
      return true;
    })().catch(e => { st.initP = null; throw e; });
    return st.initP;
  }
  async function onSession(session, ev){
    const u = session ? session.user : null;
    const changed = (u && u.id) !== (st.user && st.user.id);
    st.user = u;
    if (!u){ st.profile = null; leaveLobby(); if (changed || ev==='INITIAL') emit('auth', state()); return; }
    if (changed || !st.profile){ await loadProfile(); }
    if (ev === 'SIGNED_IN' && HAS_DOM && /type=signup|access_token/.test(location.hash||'')) { try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
    emit('auth', state());
  }
  async function loadProfile(){
    if (!st.user) return null;
    const { data } = await st.sb.from('pdm_profiles').select('id,pseudo,created_at').eq('id', st.user.id).maybeSingle();
    st.profile = data || null;
    // Profil créé à la première connexion dans CE jeu (les comptes Auth sont partagés avec d'autres apps)
    if (!st.profile){ const md = st.user.user_metadata || {}; const want = md.game === 'pdm' ? (md.pseudo || md.pdm_pseudo) : md.pdm_pseudo; if (want){ try{ await setPseudo(want); }catch(e){} } }
    if (st.profile){ joinLobby(); flushPendingRuns(); }
    return st.profile;
  }
  function state(){ return { ready:!!st.sb, loggedIn:!!st.user, user: st.user, profile: st.profile, needPseudo: !!st.user && !st.profile }; }
  const myId = () => st.user ? st.user.id : guestId();
  const myPseudo = () => st.profile ? st.profile.pseudo : ((typeof S!=='undefined' && S && S.name) ? String(S.name).slice(0,16) : 'Invité');

  /* ---------- comptes ---------- */
  async function pseudoAvailable(p){ if (!PSEUDO_RE.test(p||'')) return false; await init(); const { data, error } = await st.sb.rpc('pdm_pseudo_available', { p }); if (error) throw new Error(errMsg(error)); return !!data; }
  /* Inscription : pseudo + mot de passe uniquement. L'Edge Function pdm-signup crée le compte
     (e-mail interne dérivé du pseudo, déjà confirmé) et le profil ; on se connecte aussitôt. */
  async function signUp(pseudo, password){
    await init();
    pseudo = String(pseudo||'').trim();
    if (!PSEUDO_RE.test(pseudo)) throw new Error(ERR.pseudo_invalid);
    if (String(password||'').length < 6) throw new Error(ERR.password_short);
    if (!(await pseudoAvailable(pseudo))) throw new Error(ERR.pseudo_taken);
    let res, body = {};
    try {
      res = await fetch(CFG.url + '/functions/v1/' + CFG.signupFn, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: CFG.key, Authorization: 'Bearer ' + CFG.key }, body: JSON.stringify({ pseudo, password }) });
      body = await res.json().catch(() => ({}));
    } catch(e){ throw new Error(ERR.offline); }
    if (!res.ok || !body.ok) throw new Error(ERR[body.error] || errMsg(body.error || ('HTTP ' + res.status)));
    await signIn(pseudo, password);
    return { ok:true };
  }
  /* Connexion : pseudo (ou e-mail pour un compte existant d'une autre app) + mot de passe */
  async function signIn(id, password){
    await init();
    const { data, error } = await st.sb.auth.signInWithPassword({ email: loginEmail(id), password });
    if (error) throw new Error(errMsg(error));
    st.user = (data && (data.user || (data.session && data.session.user))) || st.user;
    await loadProfile(); emit('auth', state()); return state();
  }
  async function signOut(){ await init(); leaveRoom(); await st.sb.auth.signOut(); st.user=null; st.profile=null; emit('auth', state()); }
  async function setPseudo(p){
    await init();
    const { data, error } = await st.sb.rpc('pdm_set_pseudo', { p });
    if (error) throw new Error(errMsg(error));
    st.profile = data; joinLobby(); flushPendingRuns(); emit('auth', state()); return data;
  }

  /* ---------- classement des explorations ---------- */
  async function fetchTop3(){
    await init();
    const { data, error } = await st.sb.from('pdm_top3').select('id,user_id,pseudo,job,floor,score,duration_s,victory,mode,party_size,rk').order('floor', { ascending:false }).order('score', { ascending:false }).limit(900);
    if (error) throw error; return data || [];
  }
  async function fetchLeaderboard(f){
    await init(); f = f || {};
    let q = st.sb.from('pdm_runs').select('id,user_id,pseudo,job,companion,floor,score,duration_s,victory,mode,partner_pseudo,partner_job,party_size,created_at').order('score', { ascending:false }).order('created_at', { ascending:true }).limit(f.limit || 50);
    if (f.mode && f.mode !== 'all') q = q.eq('mode', f.mode);
    if (f.job && f.job !== 'all') q = q.eq('job', f.job);
    if (f.mine && st.user) q = q.eq('user_id', st.user.id);
    const { data, error } = await q;
    if (error) throw new Error(errMsg(error));
    return data || [];
  }
  /* run = { job, companion, floor, score, duration_s, victory, mode:'solo'|'duo', partner_pseudo, partner_job, seed } */
  function cleanRun(r){
    return { p_job:String(r.job||'').toLowerCase(), p_companion: r.companion ? String(r.companion).toLowerCase() : null,
      p_floor: Math.max(1, Math.min(50, Math.round(r.floor||1))), p_score: Math.max(0, Math.round(r.score||0)),
      p_duration_s: Math.max(5, Math.min(86400, Math.round(r.duration_s||0))), p_victory: !!r.victory,
      p_mode: r.mode === 'duo' ? 'duo' : 'solo', p_partner_pseudo: r.mode==='duo' ? (r.partner_pseudo||null) : null,
      p_partner_job: r.mode==='duo' && r.partner_job ? String(r.partner_job).toLowerCase() : null,
      p_party_size: r.mode==='duo' ? Math.max(2, Math.min(3, r.party_size||2)) : 1,
      p_seed: r.seed == null ? null : (Array.isArray(r.seed) ? r.seed.join('-') : String(r.seed)).slice(0,80) };
  }
  async function submitRun(r){
    if (r && r.mode === 'duo' && room.active && !room.host) return { ok:false, skipped:'guest' }; // en duo, seul l'hôte publie
    const args = cleanRun(r);
    try { await init(); } catch(e){ queueRun(args); return { ok:false, queued:true, reason:errMsg(e) }; }
    if (!st.user || !st.profile){ queueRun(args); return { ok:false, queued:true, reason:'login' }; }
    const { data, error } = await st.sb.rpc('pdm_submit_run', args);
    if (error){ if (/fetch|network|rate_limited/i.test(error.message||'')) queueRun(args); if (/rate_limited/.test(error.message||'')) setTimeout(()=>flushPendingRuns(), 17000); return { ok:false, reason:errMsg(error) }; }
    const { count } = await st.sb.from('pdm_runs').select('id', { count:'exact', head:true }).gt('score', args.p_score);
    emit('runSubmitted', { id:data, rank:(count||0)+1 });
    return { ok:true, id:data, rank:(count||0)+1 };
  }
  function queueRun(args){ try{ const q = JSON.parse(LS.getItem('pdm_pending_runs')||'[]'); q.push(args); LS.setItem('pdm_pending_runs', JSON.stringify(q.slice(-5))); }catch(e){} }
  let flushing = false;
  async function flushPendingRuns(){
    if (flushing || !st.profile) return; flushing = true;
    try{
      let q = JSON.parse(LS.getItem('pdm_pending_runs')||'[]');
      while (q.length){ const a = q[0]; const { error } = await st.sb.rpc('pdm_submit_run', a); if (error && /fetch|network/i.test(error.message||'')) break; if (error && /rate_limited/.test(error.message||'')){ await wait(16000); continue; } q.shift(); LS.setItem('pdm_pending_runs', JSON.stringify(q)); }
    }catch(e){} flushing = false;
  }
  const pendingRuns = () => { try{ return JSON.parse(LS.getItem('pdm_pending_runs')||'[]').length; }catch(e){ return 0; } };

  /* ---------- amis + présence ---------- */
  async function searchPlayers(q){
    await init(); q = String(q||'').trim(); if (q.length < 2) return [];
    const { data, error } = await st.sb.from('pdm_profiles').select('id,pseudo').ilike('pseudo', q.replace(/[%_\\]/g, m => '\\'+m) + '%').order('pseudo').limit(10);
    if (error) throw new Error(errMsg(error));
    return (data||[]).filter(p => !st.user || p.id !== st.user.id).map(p => Object.assign(p, { online: !!st.onlineIds[p.id] }));
  }
  async function fetchFriends(){
    await init(); if (!st.user) return [];
    const { data, error } = await st.sb.rpc('pdm_my_friends');
    if (error) throw new Error(errMsg(error));
    st.friends = (data||[]).map(f => Object.assign(f, { online: !!st.onlineIds[f.user_id], where: st.onlineIds[f.user_id] && st.onlineIds[f.user_id].where }));
    emit('friends', st.friends); return st.friends;
  }
  async function rpcFriend(fn, args){ await init(); const { data, error } = await st.sb.rpc(fn, args); if (error) throw new Error(errMsg(error)); fetchFriends().catch(()=>{}); return data; }
  const requestFriend = pseudo => rpcFriend('pdm_friend_request', { p_pseudo: pseudo });
  const respondFriend = (id, accept) => rpcFriend('pdm_friend_respond', { p_id: id, p_accept: !!accept });
  const removeFriend = uid => rpcFriend('pdm_friend_remove', { p_other: uid });

  function joinLobby(){
    if (!st.sb || !st.profile || st.lobbyCh) return;
    const ch = st.sb.channel(CFG.lobby, { config:{ presence:{ key: st.user.id }, broadcast:{ self:false } } });
    ch.on('presence', { event:'sync' }, () => {
      const ps = ch.presenceState(); const ids = {};
      Object.keys(ps).forEach(k => { const m = ps[k][0] || {}; ids[k] = { pseudo:m.pseudo, where:m.where }; });
      st.onlineIds = ids; st.friends.forEach(f => { f.online = !!ids[f.user_id]; f.where = ids[f.user_id] && ids[f.user_id].where; });
      emit('presence', ids); emit('friends', st.friends);
    });
    ch.on('broadcast', { event:'invite' }, ({ payload }) => { if (payload && payload.to === st.user.id) { emit('invite', payload); showInvite(payload); } });
    ch.on('broadcast', { event:'invite-reply' }, ({ payload }) => { if (payload && payload.to === st.user.id){ emit('inviteReply', payload); if (!payload.accept) note(`${payload.fromPseudo} a décliné l’invitation.`); } });
    ch.on('broadcast', { event:'friend-ping' }, ({ payload }) => { if (payload && payload.to === st.user.id) fetchFriends().catch(()=>{}); });
    ch.subscribe(s => { if (s === 'SUBSCRIBED') ch.track({ pseudo: st.profile.pseudo, where: room.active ? 'duo' : 'hub', at: Date.now() }); });
    st.lobbyCh = ch;
    fetchFriends().catch(()=>{});
  }
  function leaveLobby(){ if (st.lobbyCh){ try{ st.sb.removeChannel(st.lobbyCh); }catch(e){} st.lobbyCh = null; st.onlineIds = {}; } }
  function setWhere(where){ if (st.lobbyCh && st.profile) st.lobbyCh.track({ pseudo: st.profile.pseudo, where, at: Date.now() }); }
  function lobbySend(event, payload){ if (st.lobbyCh) st.lobbyCh.send({ type:'broadcast', event, payload }); }
  const pingFriend = uid => lobbySend('friend-ping', { to: uid });
  async function inviteFriend(uid){
    if (!st.profile) throw new Error(ERR.not_authenticated);
    if (!st.onlineIds[uid]) throw new Error('Ce joueur n’est pas en ligne.');
    if (!room.code) await createRoom();
    lobbySend('invite', { to: uid, from: st.user.id, fromPseudo: st.profile.pseudo, code: room.code, at: Date.now() });
    return room.code;
  }
  function replyInvite(inv, accept){ lobbySend('invite-reply', { to: inv.from, from: st.user && st.user.id, fromPseudo: myPseudo(), accept: !!accept, code: inv.code }); }

  /* =====================================================================
     DUO TEMPS RÉEL — salon + lockstep
     - salon = canal Realtime "pdm-room-CODE" (présence + broadcast)
     - les deux joueurs envoient leur action pour l'étape N ; quand les deux
       sont connues, chaque client appelle engine.applyActions(actions) (déterministe)
     - après chaque étape : empreinte d'état ; l'hôte compare et renvoie l'état complet si désync
     ===================================================================== */
  const room = { active:false, code:null, ch:null, host:false, slot:0, players:[], peers:{}, started:false, step:0, pend:{}, mine:{}, busy:false,
    hashes:{}, guestHashes:{}, resendT:null, waitT:null, waitSince:0, graceT:null, partnerAway:0, bot:false, startAck:false, startT:null, awaitResume:false, ready:false, seed:null, startedAt:0 };
  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const newCode = () => Array.from({length:5}, () => CODE_CHARS[rnd32() % CODE_CHARS.length]).join('');
  const meInfo = () => {
    const g = (typeof S !== 'undefined' && S) ? S : {};
    return { id: myId(), pseudo: myPseudo(), job: g.job || 'paladin', comp: g.comp || null, loadout: (typeof getLoadout==='function' && g.job) ? getLoadout(g.job) : null, ready: room.ready, host: room.host, v: CFG.protocol };
  };
  const partner = () => room.players.find(p => p.id !== myId()) || Object.values(room.peers).find(p => p.id !== myId()) || null;
  const partnerSlot = () => room.slot === 0 ? 1 : 0;
  const nSlots = () => Math.max(2, Math.min(3, (room.players||[]).length || 2));
  const otherSlots = () => { const o=[]; for (let i=0;i<nSlots();i++) if (i!==room.slot) o.push(i); return o; };
  const missingSlots = s => { const p = room.pend[s] || []; return otherSlots().filter(i => p[i] === undefined); };
  const awaySlots = () => (room.players||[]).map((p,i)=>i).filter(i => i!==room.slot && !room.peers[(room.players[i]||{}).id]);

  function saveRoomSession(){ if (room.started) SS.setItem('pdm_room', JSON.stringify({ code:room.code, host:room.host, slot:room.slot, players:room.players, at:Date.now() })); }
  function clearRoomSession(){ SS.removeItem('pdm_room'); }
  function resumableRoom(){ try{ const r = JSON.parse(SS.getItem('pdm_room')||'null'); return r && Date.now() - r.at < 15*60000 ? r : null; }catch(e){ return null; } }

  async function openRoomChannel(code, asHost){
    await init();
    if (room.ch) leaveRoom(true);
    Object.assign(room, { active:true, code, host:asHost, slot: asHost?0:1, players:[], peers:{}, started:false, step:0, pend:{}, mine:{}, busy:false, hashes:{}, guestHashes:{}, bot:false, partnerAway:0, ready:false, startAck:false, awaitResume:false });
    const ch = st.sb.channel(CFG.roomPrefix + code, { config:{ presence:{ key: myId() }, broadcast:{ self:false, ack:false } } });
    ch.on('presence', { event:'sync' }, onRoomPresence);
    ['start','started','act','hash','sync','hello','bye','hint','kick','config'].forEach(ev => ch.on('broadcast', { event: ev }, ({ payload }) => onRoomMsg(ev, payload||{})));
    room.ch = ch;
    await new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('Connexion au salon impossible.')), 12000);
      ch.subscribe(s => { if (s === 'SUBSCRIBED'){ clearTimeout(t); res(); } else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT'){ clearTimeout(t); rej(new Error('Connexion au salon impossible.')); } });
    });
    await ch.track(meInfo());
    setWhere('duo');
    return code;
  }
  async function createRoom(){ const code = newCode(); await openRoomChannel(code, true); emitRoom(); return code; }
  async function joinRoom(code, opt){
    code = String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if (code.length !== 5) throw new Error('Code de salon invalide (5 caractères).');
    await openRoomChannel(code, false);
    if (opt && opt.resume){ room.awaitResume = true; room.slot = opt.slot; room.host = false; room.players = opt.players||[]; }
    // vérifie qu'un hôte est là
    for (let i=0;i<16;i++){ if (Object.values(room.peers).some(p => p.id !== myId())) break; await wait(250); }
    const others = Object.values(room.peers).filter(p => p.id !== myId());
    if (!others.length){ leaveRoom(); throw new Error('Salon introuvable ou vide.'); }
    if (!room.awaitResume && Object.keys(room.peers).length > 3){ leaveRoom(); throw new Error('Ce salon est déjà complet (3 joueurs).'); }
    room.ch.send({ type:'broadcast', event:'hello', payload:{ id: myId(), resume: !!room.awaitResume } });
    emitRoom(); return code;
  }
  async function resumeRoom(){ const r = resumableRoom(); if (!r) return false; await joinRoom(r.code, { resume:true, slot:r.slot, players:r.players }); return true; }
  function leaveRoom(silent){
    if (room.ch){ try{ room.ch.send({ type:'broadcast', event:'bye', payload:{ id: myId() } }); }catch(e){} try{ st.sb.removeChannel(room.ch); }catch(e){} }
    [room.resendT, room.waitT, room.graceT, room.startT].forEach(t => t && clearInterval(t));
    Object.assign(room, { active:false, ch:null, code:null, started:false, players:[], peers:{}, resendT:null, waitT:null, graceT:null, startT:null });
    clearRoomSession(); setWhere('hub'); hideNetBar();
    if (!silent) emitRoom();
  }
  function setReady(v){ room.ready = !!v; if (room.ch) room.ch.track(meInfo()); emitRoom(); }
  function refreshMe(){ if (room.ch && !room.started) room.ch.track(meInfo()); }
  function emitRoom(){ emit('room', roomInfo()); if (HAS_DOM && curScreen === 'room') renderRoom(); }
  function roomInfo(){ return { active:room.active, code:room.code, host:room.host, slot:room.slot, started:room.started, step:room.step, players: room.started ? room.players : Object.values(room.peers), partner: partner(), partnerOnline: !room.partnerAway, bot: room.bot, waiting: !!room.mine[room.step], busy: !!room.busy, nsl: nSlots(), rx: JSON.stringify(room.rx||{}), pend: Object.keys(room.pend).map(k=>k+":"+(room.pend[k]||[]).map(a=>a?1:0).join("")).join(" ") }; }

  function onRoomPresence(){
    const ps = room.ch.presenceState(); const peers = {};
    Object.keys(ps).forEach(k => { const m = ps[k][ps[k].length-1]; if (m) peers[k] = m; });
    room.peers = peers;
    const p = partner();
    if (room.started && p){
      const gone = awaySlots(); const here = gone.length === 0;
      if (!here && !room.partnerAway){ room.partnerAway = Date.now(); startGrace(); emit('partner', { online:false, pseudo:p.pseudo }); }
      else if (here && room.partnerAway){ room.partnerAway = 0; clearInterval(room.graceT); room.graceT = null; room.bot = false; emit('partner', { online:true, pseudo:p.pseudo }); if (room.host) setTimeout(sendSync, 700); }
    }
    if (!room.started && !room.host && !Object.values(peers).some(x => x.host) && Object.keys(peers).length){ /* l'hôte est parti avant le lancement */ }
    emitRoom(); updateNetBar();
  }
  function startGrace(){
    clearInterval(room.graceT);
    room.graceT = setInterval(() => {
      updateNetBar();
      if (!room.partnerAway || Date.now() - room.partnerAway < CFG.graceMs) return;
      clearInterval(room.graceT); room.graceT = null;
      // l'autre ne revient pas : on continue seul (ses actions deviennent automatiques)
      const hostGone = !room.peers[(room.players[0]||{}).id] && !room.host;
      const present = (room.players||[]).map((x,i)=>i).filter(i => i===room.slot || room.peers[(room.players[i]||{}).id]);
      if (!room.host && hostGone && present[0] === room.slot){ room.host = true; note('L’hôte ne revient pas : tu reprends la main.'); }
      room.bot = true; emit('partner', { online:false, bot:true }); autoFillPartner();
    }, 1000);
  }

  /* lancement (hôte) */
  function canStart(){ const ps = Object.values(room.peers); return room.host && ps.length >= 2 && ps.length <= 3 && ps.every(p => p.ready) && !!engine; }
  function startDuo(){
    if (!room.host) return false;
    const ps = Object.values(room.peers);
    if (ps.length < 2 || ps.length > 3) { note('Il faut deux ou trois joueurs.'); return false; }
    if (!engine){ note('Le mode duo n’est pas encore branché dans cette version.'); return false; }
    const me = ps.find(p => p.id === myId()), others = ps.filter(p => p.id !== myId()).sort((a,b) => String(a.id).localeCompare(String(b.id)));
    const players = [me, ...others].map((p, i) => ({ slot:i, id:p.id, pseudo:p.pseudo, job:p.job, comp:p.comp, loadout:p.loadout }));
    const seed = [rnd32(), rnd32(), rnd32(), rnd32()];
    const msg = { seed, players, hostId: myId(), startedAt: Date.now(), cfg:{ turnTimeoutMs: CFG.turnTimeoutMs } };
    room.startAck = false;
    const send = () => room.ch && room.ch.send({ type:'broadcast', event:'start', payload: msg });
    send(); room.startT = setInterval(() => { if (room.startAck) { clearInterval(room.startT); room.startT = null; } else send(); }, 1500);
    beginRun(msg);
    return true;
  }
  function beginRun(msg){
    Object.assign(room, { started:true, players: msg.players, seed: msg.seed, step:0, pend:{}, mine:{}, hashes:{}, guestHashes:{}, startedAt: msg.startedAt, partnerAway:0, bot:false });
    room.slot = msg.players.findIndex(p => p.id === myId());
    if (room.slot < 0){ room.started = false; leaveRoom(); note('La partie a commencé sans toi. Demande à l’hôte de relancer un salon.'); return; }
    saveRoomSession(); emitRoom(); showNetBar();
    try { engine && engine.startDuoRun({ seed: msg.seed.slice(), players: msg.players, mySlot: room.slot, isHost: room.host, startedAt: msg.startedAt }); }
    catch(e){ console.error('[online] startDuoRun', e); }
    clearInterval(room.resendT); room.resendT = setInterval(resendTick, CFG.resendMs);
  }

  function send(ev, payload){ if (room.ch) room.ch.send({ type:'broadcast', event: ev, payload }); }
  function onRoomMsg(ev, m){
    if (ev==='act'||ev==='hint'){ const k=ev+(m.slot!=null?m.slot:'?'); room.rx=room.rx||{}; room.rx[k]=(room.rx[k]||0)+1; } // compteurs de diagnostic
    if (m.v && m.v !== CFG.protocol) return;
    switch(ev){
      case 'start':
        if (room.host) return;
        send('started', { id: myId() });
        if (!room.started) beginRun(m);
        return;
      case 'started': room.startAck = true; return;
      case 'hello':
        if (m.resume && room.started){ setTimeout(sendSync, 300); }
        return;
      case 'act': return onAct(m);
      case 'hash':
        if (!room.host) return;
        if (room.hashes[m.s] !== undefined){ if (room.hashes[m.s] !== m.h) desync(m.s); }
        else (room.guestHashes[m.s] = room.guestHashes[m.s] || []).push(m.h);
        return;
      case 'sync': return onSync(m);
      case 'hint': emit('hint', m); return;
      case 'bye': if (room.started && partner() && m.id === partner().id){ emit('partner', { online:false, left:true, pseudo: partner().pseudo }); } else if (!room.started){ emitRoom(); } return;
      case 'kick': if (m.id === myId()){ leaveRoom(); note('Le salon a été fermé.'); goto('coop'); } return;
      case 'config': emit('config', m); return;
    }
  }

  /* lockstep */
  function submit(action){
    if (!room.started) return false;
    const s = room.step;
    if (room.mine[s] !== undefined) return false;
    room.mine[s] = action;
    (room.pend[s] = room.pend[s] || [])[room.slot] = action;
    send('act', { s, slot: room.slot, a: action, v: CFG.protocol });
    room.waitSince = Date.now();
    if (room.host) armTimeout(s);
    if (room.bot) autoFillPartner();
    updateNetBar(); emitRoom();
    tryResolve();
    return true;
  }
  function hint(data){ if (room.started) send('hint', { slot: room.slot, s: room.step, d: data }); } // aperçu (vote en cours, cible survolée…)
  function onAct(m){
    if (typeof m.s !== 'number' || !(m.slot >= 0 && m.slot < nSlots())) return;
    if (m.s < room.step){ // un joueur en retard renvoie son action : on lui renvoie la nôtre (une fois par seconde au plus, jamais en réponse à une réponse)
      const rk = m.s+':'+m.slot, now = Date.now(); room.reT = room.reT || {};
      if (!m.re && m.slot !== room.slot && room.mine[m.s] !== undefined && !(now - (room.reT[rk]||0) < 1000)){ room.reT[rk] = now; send('act', { s:m.s, slot:room.slot, a: room.mine[m.s], re:1, v:CFG.protocol }); }
      return; }
    const p = room.pend[m.s] = room.pend[m.s] || [];
    if (m.slot === room.slot && !m.forced) return;
    if (p[m.slot] === undefined || m.forced){ p[m.slot] = m.a; if (m.forced && m.slot === room.slot) room.mine[m.s] = m.a; }
    if (m.slot !== room.slot && m.s === room.step) emit('partnerSubmitted', { step:m.s, slot:m.slot, action:m.a, forced:!!m.forced });
    updateNetBar(); tryResolve();
  }
  function armTimeout(s){
    clearTimeout(room.waitT);
    room.waitT = setTimeout(() => {
      if (room.step !== s || !room.started) return;
      const p = room.pend[s] || [];
      missingSlots(s).forEach(i => forcePartner(s, i));
    }, CFG.turnTimeoutMs);
  }
  function defaultActionFor(slot, s){ try{ return (engine && engine.defaultAction) ? engine.defaultAction(slot, s) : { type:'auto' }; }catch(e){ return { type:'auto' }; } }
  function forcePartner(s, slot){
    const ps = slot == null ? partnerSlot() : slot, a = defaultActionFor(ps, s);
    (room.pend[s] = room.pend[s] || [])[ps] = a;
    send('act', { s, slot: ps, a, forced:true, v:CFG.protocol });
    emit('partnerTimeout', { step:s, slot:ps });
    tryResolve();
  }
  function autoFillPartner(){ const s = room.step; if (room.host && room.bot && room.mine[s] !== undefined){ const p = room.pend[s]||[]; awaySlots().forEach(i => { if (p[i] === undefined) forcePartner(s, i); }); } }
  async function tryResolve(){
    while (room.started && !room.busy){
      const s = room.step, p = room.pend[s];
      const n = nSlots(); let full = !!p; for (let i=0;i<n && full;i++) if (p[i] === undefined) full = false;
      if (!full) break;
      room.busy = true; clearTimeout(room.waitT);
      const actions = p.slice(0, n);
      try { if (engine) await engine.applyActions(actions, { step:s, mySlot:room.slot, isHost:room.host }); }
      catch(e){ console.error('[online] applyActions', e); }
      delete room.pend[s];
      room.step = s + 1; room.busy = false;
      Object.keys(room.mine).forEach(k => { if (+k < s - 20) delete room.mine[k]; });
      const h = stateHash();
      if (room.host){ room.hashes[s] = h; if (room.guestHashes[s] !== undefined && [].concat(room.guestHashes[s]).some(x => x !== h)) desync(s); delete room.guestHashes[s]; Object.keys(room.hashes).forEach(k => { if (+k < s-30) delete room.hashes[k]; }); }
      else send('hash', { s, h, v:CFG.protocol });
      saveRoomSession(); updateNetBar(); emit('step', { step: room.step }); emitRoom();
      if (room.pendingSync){ const ps = room.pendingSync; room.pendingSync = null; onSync(ps); }
      if (room.bot) autoFillPartner();
    }
  }
  function stateHash(){ try{ return engine && engine.getState ? hash(engine.getState()) : '0'; }catch(e){ return 'err'; } }
  function desync(s){ console.warn('[online] désynchronisation à l’étape', s); emit('desync', { step:s }); sendSync(); }
  function sendSync(){
    if (!room.started || !engine) return;
    if (room.busy){ setTimeout(sendSync, 300); return; }
    send('sync', { step: room.step, state: engine.getState(), players: room.players, hostId: room.host ? myId() : (partner()||{}).id, seed: room.seed, startedAt: room.startedAt, mine: room.mine[room.step], mySlot: room.slot, pend: room.pend[room.step] || [], v:CFG.protocol });
  }
  function onSync(m){
    if (room.busy){ room.pendingSync = m; return; }
    const resuming = room.awaitResume || !room.started;
    room.host = (m.hostId === myId());
    if (resuming){
      room.awaitResume = false;
      Object.assign(room, { started:true, players:m.players, seed:m.seed, startedAt:m.startedAt, pend:{}, mine:{} });
      room.slot = m.players.findIndex(p => p.id === myId());

      clearInterval(room.resendT); room.resendT = setInterval(resendTick, CFG.resendMs);
      showNetBar();
      try { engine && (engine.resumeDuoRun ? engine.resumeDuoRun({ state:m.state, players:m.players, mySlot:room.slot, isHost:room.host, seed:m.seed }) : engine.setState(m.state)); } catch(e){ console.error('[online] resume', e); }
    } else {
      try { engine && engine.setState(m.state); } catch(e){ console.error('[online] setState', e); }
      emit('resynced', { step:m.step });
    }
    Object.keys(room.pend).forEach(k => { if (+k < m.step) delete room.pend[k]; });
    room.step = m.step;
    if (m.mine !== undefined && m.mySlot !== room.slot) (room.pend[m.step] = room.pend[m.step] || [])[m.mySlot] = m.mine;
    if (Array.isArray(m.pend)) m.pend.forEach((a,i) => { if (a != null && i !== room.slot) (room.pend[m.step] = room.pend[m.step] || [])[i] = a; });
    if (room.mine[m.step] !== undefined) send('act', { s:m.step, slot:room.slot, a:room.mine[m.step], v:CFG.protocol });
    saveRoomSession(); updateNetBar(); emitRoom(); tryResolve();
  }
  function resendTick(){
    if (!room.started) return;
    const s = room.step;
    if (room.mine[s] !== undefined && missingSlots(s).length) send('act', { s, slot:room.slot, a:room.mine[s], v:CFG.protocol });

    localStorage.setItem('pdm_vol',vol); localStorage.setItem('pdm_mute',muted?'1':'0'); localStorage.setItem('pdm_sfx',sfxVol); session(); paint(); }
  let tT=0; const test = ()=>{ const n=performance.now(); if (n-tT>250){ tT=n; last.confirm=0; sfx('confirm'); } };
  function setVol(v){ vol=Math.max(0,Math.min(1,v)); if (vol>0) muted=false; apply(); }
  function setSfx(v){ sfxVol=Math.max(0,Math.min(1,v)); apply(); }
  function toggleMute(){ muted=!muted; apply(); return muted; }
  const icon = ()=> `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${(muted||!vol)?'<path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>':'<path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'+(vol>0.5?'<path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>':'')}</svg>`;
  function paint(){ const b=document.getElementById('sndBtn'); if (b) b.innerHTML=icon(); const m=document.getElementById('sndMute'); if (m) m.textContent=muted?'Activer le son':'Couper le son'; }
  function ui(){
    if (document.getElementById('sndBox')) return;
    const w=document.createElement('div'); w.id='sndBox';
    w.innerHTML=`<button id="sndBtn" class="snd-btn" aria-label="Son"></button><div id="sndPop" class="snd-pop" hidden><input id="sndVol" type="range" min="0" max="100" step="5" aria-label="Volume"><button id="sndMute" class="snd-mute"></button></div>`;
    document.body.appendChild(w);
    const pop=w.querySelector('#sndPop'), r=w.querySelector('#sndVol');
    r.value=Math.round(vol*100);
    w.querySelector('#sndBtn').onclick=e=>{ e.stopPropagation(); pop.hidden=!pop.hidden; };
    r.oninput=()=>{ vol=r.value/100; if (vol>0) muted=false; apply(); };
    r.onchange=test;
    w.querySelector('#sndMute').onclick=e=>{ e.stopPropagation(); muted=!muted; apply(); };
    document.addEventListener('pointerdown', e=>{ if (!w.contains(e.target)) pop.hidden=true; }, true);
    paint();
  }
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('touchend', unlock, true); // iOS : déverrouillage au premier toucher
  document.addEventListener('visibilitychange', ()=>{ if (!ctx) return; if (document.hidden) ctx.suspend(); else ctx.resume(); });
  document.addEventListener('keydown', unlock, true);
  document.addEventListener('click', unlock, true);
  document.addEventListener('touchstart', unlock, {capture:true, passive:true});
  // clics de menu
  document.addEventListener('click', e=>{
    const b=e.target.closest && e.target.closest('button'); if (!b || b.closest('#sndBox') || b.disabled) return;
    if (b.closest('#skills') || b.closest('.skills') || b.closest('.enemy')) return;
    const t=(b.textContent||'').trim().toLowerCase();
    if (/^(retour|annuler|fermer|non|quitter|abandonner)/.test(t) || b.classList.contains('ghost')) sfx('cancel');
    else if (b.classList.contains('gold') || b.classList.contains('primary') || b.classList.contains('main') || /^(confirmer|valider|oui|commencer|lancer|continuer|prêt|invoquer)/.test(t)) sfx('confirm');
    else sfx('click');
  }, true);
  if (document.readyState!=='loading') ui(); else document.addEventListener('DOMContentLoaded', ui);
  return { music, sfx, ui, unlock, setVol, setSfx, toggleMute, test, get vol(){return vol;}, get sfxVol(){return sfxVol;}, get muted(){return muted;},
    dbg: ()=>({ state: ctx?ctx.state:'none', ctx: st.ctx, el: st.el, err: st.err, useEl, ios: IOS, vol, sfxVol, muted, loaded: Object.keys(buf) }) };
})();
// Branchements sur le moteur (enveloppes, aucun changement de logique)
(function(){
  try {
    const oSC=startCombat; startCombat=function(kind){ SND.music(kind==='boss'?'boss_'+(GUARDIAN_OF[R.floor]||R.floor):kind==='elite'?'elite':'battle_t'+Math.min(5,Math.max(1,Math.ceil((R.floor||1)/10)))); return oSC.apply(this,arguments); };
    const oWC=winCombat; winCombat=function(){ const boss=C&&C.kind==='boss'; SND.music(boss?'bossvictory':'victory'); return oWC.apply(this,arguments); };
    const oER=endRun; endRun=function(victory){ SND.music(victory?'runwin':'fail'); return oER.apply(this,arguments); };
    const oUS=useSkill; useSkill=function(s){ SND.sfx(s&&(s.stat==='mag'||s.heal||s.target==='self')?'cast':'hit'); return oUS.apply(this,arguments); };
    const oDP=damagePlayer; damagePlayer=function(){ const h=R&&R.hp; const r=oDP.apply(this,arguments); if (R && R.hp<h) SND.sfx('hurt'); return r; };
    const oHR=healR; healR=function(n){ const h=R&&R.hp; const r=oHR.apply(this,arguments); if (C && R && R.hp>h) SND.sfx('heal'); return r; };
  } catch(e){ console.error('[snd]', e); }
})();
if ('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.addEventListener('error', e=>{ window.__errors=(window.__errors||[]); window.__errors.push(String(e.message)); });
function setFast(v){ FAST=!!v; }
window.GAME = { get S(){return S;}, get R(){return R;}, get C(){return C;}, SCREENS, JOBS, ENEMIES, BAL, POMS, playerAction, startRun, setFast, alive, skillState, getLoadout,
  combatSkills, canInterrupt, intentEst, eMul, Lf, enterRoom, advanceNode, endRun, REWARDS, REW, COMPANIONS, EVENTS, doPull, planFloor, drawRewards, get RS(){return RS;}, rand, showRewards };
loadCustomSprites();
SCREENS.title();
